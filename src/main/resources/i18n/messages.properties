legal.confidentialite.titre=Politique de confidentialité
legal.confidentialite.intro=Cette politique décrit les traitements de données personnelles réalisés par le garage au moyen de la plateforme AutoServ+. Elle est le pendant public du registre joint à l'export de vos données : les deux sont produits à partir de la même source, et ne peuvent donc pas diverger.
