legal.confidentialite.durees.titre=Durées de conservation
legal.confidentialite.durees.colonne.donnees=Données
legal.confidentialite.durees.colonne.duree=Durée
legal.confidentialite.durees.comptable=Les pièces comptables déjà émises — factures et notes de crédit — ne sont ni modifiées ni supprimées lorsqu'un compte est supprimé : leur conservation repose sur une obligation légale, qui écarte le droit à l'effacement pour ces seuls documents (article 17.3.b du règlement). La fiche du membre, elle, est anonymisée.
legal.confidentialite.droits.titre=Vos droits
legal.confidentialite.droits.colonne.droit=Droit
legal.confidentialite.droits.colonne.article=Fondement
legal.confidentialite.exercice.titre=Comment exercer vos droits
legal.confidentialite.exercice.corps=Depuis la rubrique « Mes données personnelles » de votre compte, vous pouvez télécharger l'ensemble de vos données dans un format structuré et demander la suppression de votre compte. Les deux opérations demandent la saisie de votre mot de passe.
legal.confidentialite.cookies.titre=Cookies
legal.confidentialite.cookies.corps=La plateforme dépose des cookies strictement nécessaires à son fonctionnement. Les finalités optionnelles sont soumises à votre consentement, recueilli finalité par finalité et modifiable à tout moment.
legal.confidentialite.securite.titre=Sécurité
legal.confidentialite.securite.corps=Les mots de passe sont conservés sous forme d'empreinte non réversible. Les échanges avec le site sont chiffrés en transit. L'accès au back-office est réservé au personnel du garage.

