legal.cgv.intro=Les présentes conditions régissent la vente de pièces et de prestations d'atelier par l'intermédiaire de la plateforme AutoServ+.
legal.cgv.art1.titre=Article 1 — Vendeur
legal.cgv.art1.corps=Le vendeur est le garage identifié ci-dessous, inscrit à la Banque-Carrefour des Entreprises et assujetti à la taxe sur la valeur ajoutée.
legal.cgv.art2.titre=Article 2 — Champ d'application et acceptation
legal.cgv.art2.corps=Toute commande passée sur la plateforme suppose l'acceptation préalable et expresse des présentes conditions. Cette acceptation est recueillie par une case à cocher au récapitulatif de commande ; elle est horodatée et conservée avec la version du document acceptée et l'adresse IP utilisée.
legal.cgv.art3.titre=Article 3 — Prix et taxe sur la valeur ajoutée
legal.cgv.art3.corps=Les prix sont indiqués en euros, hors taxe et taxe comprise. Les taux appliqués sont les taux belges de 0, 6, 12 et 21 %. Le prix, le libellé et le taux de taxe d'un article sont figés au moment où il est ajouté au panier : une modification ultérieure du catalogue reste sans effet sur un panier déjà constitué.
legal.cgv.art4.titre=Article 4 — Commande
legal.cgv.art4.corps=La commande se forme en trois temps : constitution du panier, récapitulatif reprenant le détail des lignes et des montants, puis validation. Le bouton de validation indique expressément que la commande oblige au paiement. Un panier ne peut contenir que des pièces ou que des prestations, jamais les deux à la fois.
legal.cgv.art5.titre=Article 5 — Paiement
legal.cgv.art5.corps=Le paiement s'effectue en ligne auprès d'un prestataire de services de paiement. Aucune donnée de carte n'est collectée ni conservée par le garage. La commande n'est réputée payée qu'après confirmation du statut par le prestataire.
legal.cgv.art6.titre=Article 6 — Retrait et exécution
legal.cgv.art6.corps=Les pièces commandées sont retirées au garage ; aucune expédition n'est proposée. L'achat en ligne d'une prestation ne réserve pas de créneau : le garage ouvre le dossier d'atelier et convient de la date avec le client.
legal.cgv.art6.completer=[À COMPLÉTER : horaires et modalités de retrait, délai de mise à disposition, sort des pièces non retirées.]
legal.cgv.art7.titre=Article 7 — Droit de rétractation
legal.cgv.art7.corps=Le consommateur dispose d''un délai de {0} jours pour se rétracter, sans avoir à motiver sa décision. Ce délai court à compter de la conclusion de la commande. La demande se dépose depuis l''espace membre ; le garage l''examine et notifie sa décision. En cas d''acceptation, une note de crédit est émise et le remboursement intervient par le même moyen de paiement que celui employé lors de l''achat.
legal.cgv.art7.completer=[À COMPLÉTER : formulaire type de rétractation à annexer, et point de départ du délai en cas de mise à disposition différée.]
legal.cgv.art8.titre=Article 8 — Prestations pleinement exécutées
legal.cgv.art8.corps=Lorsque le client demande l'exécution d'une prestation avant la fin du délai de rétractation, il lui est proposé de reconnaître expressément qu'il perdra ce droit une fois la prestation pleinement exécutée. Cette renonciation est facultative, n'est jamais pré-cochée, et sa preuve est conservée. Tant que la prestation n'est pas pleinement exécutée, le droit de rétractation subsiste.
legal.cgv.art9.titre=Article 9 — Facture
legal.cgv.art9.corps=Une facture est émise pour toute commande payée et mise à disposition au format PDF dans l'espace membre. Les factures sont numérotées de manière continue et sans interruption, par exercice. Elles sont conservées sept ans, conformément à la législation relative à la taxe sur la valeur ajoutée.
legal.cgv.art10.titre=Article 10 — Garantie légale de conformité
legal.cgv.art10.completer=[À COMPLÉTER : durée et modalités de la garantie légale de conformité, garantie commerciale éventuelle, et régime applicable aux prestations de réparation.]
legal.cgv.art11.titre=Article 11 — Responsabilité
legal.cgv.art11.completer=[À COMPLÉTER : limites de responsabilité, force majeure, et obligations du client quant à l'état du véhicule confié.]
legal.cgv.art12.titre=Article 12 — Données personnelles
legal.cgv.art12.corps=Le traitement des données personnelles est décrit dans la politique de confidentialité, accessible depuis chaque page du site.
legal.cgv.art13.titre=Article 13 — Droit applicable et litiges
legal.cgv.art13.completer=[À COMPLÉTER : droit applicable, juridiction compétente, procédure de règlement amiable et renvoi vers la plateforme européenne de règlement en ligne des litiges.]
