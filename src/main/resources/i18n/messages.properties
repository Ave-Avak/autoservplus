legal.cgv.titre=Conditions générales de vente
legal.cgv.intro=Les présentes conditions régissent la vente de pièces et de prestations d'atelier par l'intermédiaire de la plateforme AutoServ+.
legal.cgv.art1.titre=Article 1. Vendeur
legal.cgv.art1.corps=Le vendeur est le garage identifié ci-dessous, inscrit à la Banque-Carrefour des Entreprises et assujetti à la taxe sur la valeur ajoutée.
legal.cgv.art2.titre=Article 2. Champ d'application et acceptation
legal.cgv.art2.corps=Toute commande passée sur la plateforme suppose l'acceptation préalable et expresse des présentes conditions. Cette acceptation est recueillie par une case à cocher au récapitulatif de commande. Elle est horodatée et conservée avec la version du document acceptée et l'adresse IP utilisée.
legal.cgv.art3.titre=Article 3. Prix et taxe sur la valeur ajoutée
legal.cgv.art3.corps=Les prix sont indiqués en euros, hors taxe et taxe comprise. Les taux appliqués sont les taux belges de 0, 6, 12 et 21 %. Le prix, le libellé et le taux de taxe d'un article sont figés au moment où il est ajouté au panier : une modification ultérieure du catalogue reste sans effet sur un panier déjà constitué.
legal.cgv.art4.titre=Article 4. Commande
legal.cgv.art4.corps=La commande se forme en trois temps : constitution du panier, récapitulatif reprenant le détail des lignes et des montants, puis validation. Le bouton de validation indique expressément que la commande oblige au paiement. Un panier ne peut contenir que des pièces ou que des prestations, jamais les deux à la fois.
legal.cgv.art5.titre=Article 5. Paiement
legal.cgv.art5.corps=Le paiement s'effectue en ligne auprès d'un prestataire de services de paiement. Aucune donnée de carte n'est collectée ni conservée par le garage. La commande n'est réputée payée qu'après confirmation du statut par le prestataire.
legal.cgv.art6.titre=Article 6. Retrait et exécution
legal.cgv.art6.corps=Les pièces commandées sont retirées au garage, à l'adresse indiquée à l'article 1. Aucune expédition n'est proposée. Elles sont mises à la disposition du client au plus tard trente jours après la conclusion de la commande, sauf si une autre date a été convenue avec lui (article VI.43, § 1er, du Code de droit économique).
legal.cgv.art6.completer=L'achat en ligne d'une prestation ne réserve pas de créneau : le garage ouvre le dossier d'atelier et convient avec le client de la date d'exécution. La prestation est exécutée dans l'atelier du garage, à la date convenue.
legal.cgv.art6.confirmation=Le courriel de confirmation de la commande reprend, sur un support durable, les informations prévues à l'article VI.46, § 7, du Code de droit économique.
legal.cgv.art7.titre=Article 7. Droit de rétractation
legal.cgv.art7.entree=Dans le présent article, « nous » désigne le garage et « vous » le consommateur.
legal.cgv.art7.droit=Vous avez le droit de vous rétracter du présent contrat sans donner de motif dans un délai de quatorze jours.
legal.cgv.art7.delai=Le délai de rétractation expire 14 jours après le jour de la conclusion du contrat, pour une prestation de service. Pour un achat de pièces, il expire 14 jours après le jour où vous-même, ou un tiers autre que le transporteur et désigné par vous, prend physiquement possession du bien. Si des pièces d'une même commande vous sont remises séparément, il expire 14 jours après le jour où vous-même, ou un tiers autre que le transporteur et désigné par vous, prend physiquement possession du dernier bien.
legal.cgv.art7.notification=Pour exercer le droit de rétractation, vous devez nous notifier, aux coordonnées de l'article 1 (nom, adresse géographique, numéro de téléphone et adresse électronique), votre décision de rétractation du présent contrat au moyen d'une déclaration dénuée d'ambiguïté (par exemple, lettre envoyée par la poste ou courrier électronique). Vous pouvez utiliser le modèle de formulaire de rétractation mais ce n'est pas obligatoire.
legal.cgv.art7.en-ligne=Vous pouvez également exercer votre droit de rétractation en ligne sur la page « Mes commandes » de votre espace membre, au moyen du lien « Renoncer au contrat ici ». Si vous utilisez cette fonctionnalité en ligne, nous vous enverrons, immédiatement, un accusé de réception de la rétractation sur un support durable (par exemple, par courriel), y compris son contenu ainsi que la date et l'heure de sa soumission.
legal.cgv.art7.respect=Pour que le délai de rétractation soit respecté, il suffit que vous transmettiez votre communication relative à l'exercice du droit de rétractation avant l'expiration du délai de rétractation.
legal.cgv.art7.effets.titre=Effets de la rétractation
legal.cgv.art7.effets=En cas de rétractation de votre part du présent contrat, nous vous rembourserons tous les paiements reçus de vous, y compris les frais de livraison (à l'exception des frais supplémentaires découlant du fait que vous avez choisi, le cas échéant, un mode de livraison autre que le mode moins coûteux de livraison standard proposé par nous) sans retard excessif et, en tout état de cause, au plus tard quatorze jours à compter du jour où nous sommes informés de votre décision de rétractation du présent contrat. Nous procéderons au remboursement en utilisant le même moyen de paiement que celui que vous aurez utilisé pour la transaction initiale, sauf si vous convenez expressément d'un moyen différent; en tout état de cause, ce remboursement n'occasionnera pas de frais pour vous.
legal.cgv.art7.suite=Nous vous informons par courriel de la suite donnée à votre rétractation. Nous ne la refusons que si le délai de rétractation est expiré, ou si l'une des exceptions prévues à l'article VI.53 du Code de droit économique s'applique, notamment celle de l'article 8. Une note de crédit est émise pour le montant remboursé.
legal.cgv.art7.pieces.titre=Si vous avez acheté des pièces
legal.cgv.art7.pieces.differer=Nous pouvons différer le remboursement jusqu'à ce que nous ayons reçu le bien ou jusqu'à ce que vous ayez fourni une preuve d'expédition du bien, la date retenue étant celle du premier de ces faits.
legal.cgv.art7.pieces.renvoi=Vous devrez renvoyer ou rendre le bien, à nous-mêmes, à l'adresse de l'article 1, sans retard excessif et, en tout état de cause, au plus tard 14 jours après que vous nous aurez communiqué votre décision de rétractation du présent contrat. Ce délai est réputé respecté si vous renvoyez le bien avant l'expiration du délai de quatorze jours.
legal.cgv.art7.pieces.frais=Nous prendrons en charge les frais de renvoi du bien.
legal.cgv.art7.pieces.responsabilite=Votre responsabilité n'est engagée qu'à l'égard de la dépréciation du bien résultant de manipulations autres que celles nécessaires pour établir la nature, les caractéristiques et le bon fonctionnement de ce bien.
legal.cgv.art7.prestation.titre=Si vous avez commandé une prestation
legal.cgv.art7.prestation.montant=Si vous avez demandé de commencer la prestation de services pendant le délai de rétractation, vous devrez nous payer un montant proportionnel à ce qui vous a été fourni jusqu'au moment où vous nous avez informé de votre rétractation du présent contrat, par rapport à l'ensemble des prestations prévues par le contrat.
legal.cgv.art8.titre=Article 8. Prestations pleinement exécutées
legal.cgv.art8.corps=Lorsque le client demande l'exécution d'une prestation avant la fin du délai de rétractation, il lui est proposé de reconnaître expressément qu'il perdra ce droit une fois la prestation pleinement exécutée. Cette renonciation est facultative, n'est jamais pré-cochée, et sa preuve est conservée. Tant que la prestation n'est pas pleinement exécutée, le droit de rétractation subsiste.
legal.cgv.art9.titre=Article 9. Facture
legal.cgv.art9.corps=Une facture est émise pour toute commande payée et mise à disposition au format PDF dans l'espace membre. Les factures sont numérotées de manière continue et sans interruption, par exercice. Elles sont conservées dix ans, conformément à la législation relative à la taxe sur la valeur ajoutée.
legal.cgv.art10.titre=Article 10. Garantie légale de conformité
legal.cgv.art10.completer=Pour les biens vendus au consommateur, la garantie légale de conformité de deux ans est applicable (articles 1649bis et suivants de l'ancien Code civil, désormais intégrés au livre 5 du nouveau Code civil). Cette garantie est due par le vendeur, c'est-à-dire le garage. Pour les prestations de service (entretien, réparation, diagnostic, etc.), le garage est tenu d'une obligation de conformité de droit commun : la prestation doit être conforme à ce qui a été convenu. Cette obligation n'est pas assortie d'une durée fixe mais reste encadrée par les règles de la prescription. La présente garantie légale s'applique indépendamment de toute garantie commerciale éventuelle. Le garage n'offre aucune garantie commerciale ni service après-vente distinct de ces garanties légales.
legal.cgv.art11.titre=Article 11. Responsabilité
legal.cgv.art11.completer=Le garage est responsable de la bonne exécution des prestations vendues, dans les conditions du droit commun (livre 6 du Code civil, entré en vigueur le 1er janvier 2025) et des présentes conditions. Les informations publiées sur le site sont fournies à titre indicatif. Le garage s'efforce de les tenir exactes et à jour sans garantir leur exhaustivité ou l'absence d'erreur. La responsabilité du garage ne peut en aucun cas être exclue ou limitée en cas de faute lourde, de dol, d'atteinte à la vie ou à l'intégrité physique, ni pour les obligations légales impératives (notamment la garantie légale de conformité et la sécurité des produits et services). Le garage n'assume aucune responsabilité quant au contenu des sites tiers accessibles par des liens, sur lesquels il n'exerce aucun contrôle.
legal.cgv.art12.titre=Article 12. Données personnelles
legal.cgv.art12.corps=Le traitement des données personnelles est décrit dans la politique de confidentialité, accessible depuis chaque page du site.
legal.cgv.art13.titre=Article 13. Droit applicable et litiges
legal.cgv.art13.completer=Les présentes conditions sont régies par le droit belge. Les réclamations s'adressent au garage, aux coordonnées de l'article 1. En cas de litige, les parties rechercheront une solution amiable avant toute action judiciaire. Le consommateur peut s'adresser au Service de médiation pour le consommateur (Boulevard du Roi Albert II 8, 1000 Bruxelles, site : mediationconsommateur.be). À défaut de règlement amiable, les cours et tribunaux belges sont compétents. Le consommateur conserve toutefois le bénéfice des règles protectrices lui permettant, le cas échéant, de saisir la juridiction de son lieu de domicile.
legal.mentions.titre=Mentions légales
legal.mentions.editeur.titre=Éditeur du site
legal.mentions.responsable.titre=Responsable de la publication
legal.mentions.responsable.completer=Le responsable de la publication du présent site est le représentant légal du garage, {0} ({1}), dont le siège est établi {2}. Numéro d''entreprise (BCE) : {3}. Numéro de TVA : {4}. Contact : {5}, {6}.
legal.mentions.hebergeur.titre=Hébergeur
legal.mentions.hebergeur.completer=Le site est hébergé par Hetzner Online GmbH, Industriestr. 25, 91710 Gunzenhausen, Allemagne. Téléphone : +49 (0)9831 505-0. Site : www.hetzner.com. Les serveurs utilisés sont situés au sein de l'Union européenne.
legal.mentions.propriete.titre=Propriété intellectuelle
legal.mentions.propriete.completer=L'ensemble des éléments du site (textes, images, graphismes, logo, structure, mise en forme) est protégé par le droit de la propriété intellectuelle et demeure la propriété exclusive du garage ou de ses partenaires. Toute reproduction, représentation, diffusion ou exploitation, totale ou partielle, sans autorisation écrite préalable, est interdite. La plateforme technique sous-jacente et son code source demeurent la propriété de leur éditeur, AutoServ+.
legal.mentions.propriete.photos-demonstration=Les photos du catalogue de démonstration viennent d'Unsplash et sont publiées sous la licence Unsplash. Leurs auteurs sont nommés dans le fichier docs/credits-photos.md du dépôt du projet.
legal.mentions.profession.titre=Accès à la profession et assurances
legal.mentions.profession.completer=Le garage déclare exercer son activité conformément à la réglementation belge applicable à sa profession. Les informations relatives à ses assurances professionnelles (notamment responsabilité civile) et à son accès à la profession sont disponibles sur simple demande auprès du garage, aux coordonnées de contact ci-dessus.
legal.mentions.contact.titre=Contact
legal.mentions.contact.corps=Toute question relative au site ou à une commande peut être adressée au garage par courriel ou par téléphone, aux coordonnées reprises ci-dessus.
legal.mentions.liens.titre=Documents liés
legal.confidentialite.titre=Politique de confidentialité
legal.confidentialite.intro=Cette politique décrit les traitements de données personnelles réalisés par le garage au moyen de la plateforme AutoServ+. Elle est le pendant public du registre joint à l'export de vos données : les deux sont produits à partir de la même source, et ne peuvent donc pas diverger.
legal.confidentialite.responsable.titre=Responsable du traitement
legal.confidentialite.dpo.titre=Délégué à la protection des données
legal.confidentialite.dpo.completer=Compte tenu de la nature et du volume des traitements réalisés, aucun délégué à la protection des données (DPO) n''a été désigné, cette désignation n''étant pas obligatoire au sens de l''article 37 du RGPD. Pour toute question ou pour exercer vos droits (accès, rectification, effacement, portabilité, opposition), vous pouvez contacter le garage à l''adresse {0}. Vous disposez également du droit d''introduire une réclamation auprès de l''Autorité de protection des données (APD), rue de la Presse 35, 1000 Bruxelles, site : autoriteprotectiondonnees.be.
