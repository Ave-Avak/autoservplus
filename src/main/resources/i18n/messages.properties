# Courriels transactionnels, en texte brut, dans la langue du compte
courriel.salutation=Bonjour {0},
courriel.signature=Ce message est envoyé automatiquement par {0}. Merci de ne pas y répondre.
courriel.pied.contact=Pour joindre le garage :
courriel.pied.telephone=Téléphone : {0}
courriel.pied.courriel=Courriel : {0}
courriel.verification-adresse.sujet=Confirmez votre adresse de courriel
courriel.verification-adresse.corps=Pour activer votre compte, confirmez votre adresse en suivant ce lien, valable 24 heures :\n{0}\n\nSi vous n''avez pas créé de compte, ignorez ce message.
courriel.rappel-verification.sujet=Votre compte n'est pas encore activé
courriel.rappel-verification.corps=Une demande a été faite pour cette adresse, mais votre compte n''a jamais été activé. Activez-le en suivant ce lien, valable 24 heures :\n{0}
courriel.tentative-inscription.sujet=Une inscription a été tentée avec votre adresse
courriel.tentative-inscription.corps=Quelqu''un a tenté de créer un compte avec votre adresse de courriel. Vous en avez déjà un, et aucun autre n''a été créé.\n\nSi c''était vous, connectez-vous :\n{0}\n\nSi vous avez oublié votre mot de passe, demandez-en un nouveau :\n{1}\n\nSi ce n''était pas vous, ignorez ce message : votre compte n''a pas été modifié.
courriel.reinitialisation.sujet=Choisissez un nouveau mot de passe
courriel.reinitialisation.corps=Pour choisir un nouveau mot de passe, suivez ce lien, valable une heure et une seule fois :\n{0}\n\nSi vous n''êtes pas à l''origine de cette demande, ignorez ce message : votre mot de passe reste inchangé.
courriel.definition-mot-de-passe.sujet=Votre compte administrateur
courriel.definition-mot-de-passe.corps=Un compte administrateur a été créé à votre nom. Choisissez votre mot de passe en suivant ce lien, valable 24 heures et une seule fois :\n{0}
courriel.verrouillage-second-facteur.sujet=Votre compte est verrouillé
courriel.verrouillage-second-facteur.corps=Cinq codes de vérification incorrects ont été saisis après votre mot de passe. Votre compte est verrouillé jusqu''au {0} à {1}.\nSi ce n''était pas vous, votre mot de passe est connu d''un tiers : changez-le dès que possible.
courriel.verrouillage-connexion.sujet=Votre compte est verrouillé
courriel.verrouillage-connexion.corps=Cinq mots de passe incorrects ont été saisis pour votre compte. Il est verrouillé jusqu''au {0} à {1}.\nSi ces tentatives ne venaient pas de vous, choisissez un nouveau mot de passe depuis la page de connexion : quelqu''un a essayé d''accéder à votre compte. Un nouveau mot de passe vous rend aussi l''accès sans attendre.
courriel.second-facteur-reinitialise.sujet=Votre second facteur a été réinitialisé
courriel.second-facteur-reinitialise.corps=Un super-administrateur a réinitialisé votre second facteur. Vos codes de secours ne sont plus valables, et vos sessions ouvertes ont été fermées.\nSi vous n'en êtes pas à l'origine, contactez le garage.
courriel.nouvelle-adresse.sujet=Confirmez votre nouvelle adresse
courriel.nouvelle-adresse.corps=Pour que cette adresse remplace {0} sur votre compte, confirmez-la en suivant ce lien, valable deux heures :\n{1}\n\nSans confirmation, votre compte reste joignable à votre adresse actuelle.
courriel.avis-changement-adresse.sujet=Demande de changement d'adresse sur votre compte
courriel.avis-changement-adresse.corps=Une demande de changement d''adresse vers {0} a été enregistrée sur votre compte.\nSi vous n''en êtes pas à l''origine, connectez-vous et changez votre mot de passe : la demande sera abandonnée.
courriel.compte-supprime.sujet=Votre compte est supprimé
courriel.compte-supprime.corps=Votre compte a bien été supprimé. Vos données personnelles ont été effacées et votre accès révoqué.\nVos factures restent conservées sept ans, comme la loi l'impose (article 60 du Code de la TVA). Elles ne vous identifient plus dans l'application.
courriel.rdv-confirme.sujet=Votre rendez-vous est confirmé
courriel.rdv-confirme.corps=Votre rendez-vous {0} du {1} à {2} est confirmé.
courriel.rdv-confirme.agenda=Le fichier joint l'ajoute à votre agenda.
courriel.rdv-refuse.sujet=Votre demande de rendez-vous n'a pas pu être acceptée
courriel.rdv-refuse.corps=Votre demande de rendez-vous {0} du {1} à {2} n''a pas pu être acceptée.\nMotif : {3}
courriel.rdv-annule.sujet=Votre rendez-vous est annulé
courriel.rdv-annule.corps=Le garage a dû annuler votre rendez-vous {0} du {1} à {2}.\nMotif : {3}
courriel.depassement.sujet=Votre accord est demandé pour des travaux supplémentaires
courriel.depassement.corps=Pendant l''intervention {0} sur votre {1}, le garage propose des travaux qui dépassent le devis initial.\nDevis initial, TVA comprise : {2}, soit {3} hors TVA\nMontant à payer, TVA comprise, si vous acceptez : {4}, soit {5} hors TVA\nTravaux soumis à votre accord, TVA comprise :\n{6}\n\nRépondez depuis votre espace :\n{7}
courriel.intervention-terminee.sujet=Votre véhicule est prêt
courriel.intervention-terminee.corps=Les travaux de l''intervention {0} sur votre {1} ({2}) sont terminés. Vous pouvez venir récupérer votre véhicule aux heures d''ouverture du garage.\n\nVous pouvez aussi déposer un avis sur votre expérience :\n{3}
courriel.intervention-terminee.facture=Votre facture d''atelier s''élève à {0}, à régler à l''atelier. Consultez-la dans votre espace :\n{1}
courriel.confirmation-commande.sujet=Confirmation de votre commande
courriel.confirmation-commande.corps=Votre paiement de {1} a été reçu le {3}. Ce courriel confirme, sur un support durable, le contrat conclu le {2} pour la commande {0} (article VI.46, § 7, du Code de droit économique). Conservez-le avec ses pièces jointes.
courriel.confirmation-commande.vendeur=Vendeur
courriel.confirmation-commande.commande=Votre commande
courriel.confirmation-commande.ligne={0}, quantité {1} : {2} TVAC, TVA {3} %
courriel.confirmation-commande.total-htva=Total hors TVA : {0}
