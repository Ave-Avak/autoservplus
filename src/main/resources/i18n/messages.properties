garantie-legale.notice.titre=GARANTIE LÉGALE
garantie-legale.notice.protection=Protection offerte par la garantie légale minimale de deux ans sur des biens vendus dans l'Union européenne.
garantie-legale.notice.consommateurs=Les consommateurs peuvent faire valoir leurs droits au titre de la garantie légale de conformité, par exemple si les biens:
garantie-legale.notice.cas.1=ne correspondent pas à la description;
garantie-legale.notice.cas.2=ne fonctionnent pas comme prévu.
garantie-legale.notice.vendeurs=Les vendeurs sont responsables de tout défaut de conformité qui existait au moment de la livraison des biens et qui apparaît pendant la période de garantie légale. Les vendeurs se trouvant dans une telle situation sont tenus de proposer:
garantie-legale.notice.remede.1=une réparation gratuite ou un remplacement gratuit;
garantie-legale.notice.remede.2=dans certains cas, une réduction de prix ou un remboursement intégral.
garantie-legale.notice.pays=Dans certains pays, la période de garantie légale est plus longue. Pour les biens d'occasion, une période plus courte peut s'appliquer, mais elle ne peut être inférieure à un an.
garantie-legale.notice.savoir-plus=Pour en savoir plus sur vos droits dans un pays donné, scannez le code QR ci-dessous ou consultez le vendeur.
garantie-legale.notice.adresse=europa.eu/youreurope/garanties
garantie-legale.notice.quefaire=Que faire
garantie-legale.notice.quefaire.sous=si vous recevez des biens non conformes:
garantie-legale.notice.etape.1=contactez le vendeur dès que possible pour signaler le problème;
garantie-legale.notice.etape.2=fournissez une preuve d'achat, telle qu'un reçu, une facture ou un relevé bancaire.
garantie-legale.notice.commerciales=Les vendeurs et les producteurs peuvent également offrir des garanties commerciales, qui s'appliquent indépendamment de la garantie légale. Par exemple, il se peut que votre bien affiche ce label GARAN, représentant une garantie commerciale de durabilité offerte par le producteur sans frais supplémentaires et s'appliquant à l'ensemble du bien.
