legal.cgv.titre=Terms and conditions of sale
legal.cgv.intro=These terms govern the sale of parts and workshop services through the AutoServ+ platform.
legal.cgv.art1.titre=Article 1 — Seller
legal.cgv.art1.corps=The seller is the garage identified below, registered with the Crossroads Bank for Enterprises and liable for value added tax.
legal.cgv.art2.titre=Article 2 — Scope and acceptance
legal.cgv.art2.corps=Every order placed on the platform requires the prior and express acceptance of these terms. That acceptance is collected through a checkbox on the order summary; it is time-stamped and stored together with the version of the document accepted and the IP address used.
legal.cgv.art3.titre=Article 3 — Prices and value added tax
legal.cgv.art3.corps=Prices are shown in euro, excluding and including tax. The rates applied are the Belgian rates of 0, 6, 12 and 21 %. The price, description and tax rate of an item are frozen at the moment it is added to the basket: a later change to the catalogue has no effect on a basket already assembled.
legal.cgv.art4.titre=Article 4 — Order
legal.cgv.art4.corps=An order is formed in three steps: building the basket, a summary showing each line and each amount, then confirmation. The confirmation button states expressly that the order carries an obligation to pay. A basket may contain either parts or services, never both at once.
legal.cgv.art5.titre=Article 5 — Payment
legal.cgv.art5.corps=Payment is made online through a payment service provider. No card data is collected or stored by the garage. An order is treated as paid only after the provider has confirmed its status.
legal.cgv.art6.titre=Article 6 — Collection and performance
legal.cgv.art6.corps=Ordered parts are collected at the garage; no shipping is offered. Buying a service online does not book a time slot: the garage opens the workshop file and agrees a date with the customer.
legal.cgv.art6.completer=Goods ordered (parts, accessories) are collected on site, at the garage address given in Article 1; no shipping is offered. Services are performed in the garage workshop, on the date agreed when booking or, failing that, within a reasonable period notified to the customer. The expected performance date is repeated in the order summary and in the confirmation e-mail, which constitutes the durable medium for the pre-contractual information (Article VI.45 §7 of the Code of Economic Law).
legal.cgv.art7.titre=Article 7 — Right of withdrawal
legal.cgv.art7.corps=The consumer has {0} days to withdraw, without having to give any reason. That period runs from the conclusion of the order. The request is submitted from the member area; the garage examines it and notifies its decision. If accepted, a credit note is issued and the refund is made using the same means of payment as the purchase.
legal.cgv.art7.completer=The consumer may exercise the right of withdrawal without having to give any reason and without penalty (Article VI.47 of the Code of Economic Law). To do so, they notify the garage of their decision by an unambiguous statement (letter or e-mail to the contact details in Article 1), or by using the model withdrawal form made available to them, downloadable and reachable through a permanent link in their member area. The garage refunds all sums paid within fourteen days of receiving the withdrawal, using the same means of payment as the one used for the order, unless the consumer expressly agrees to another means. This right does not apply in the cases of exclusion set out in Article VI.53 of the Code of Economic Law, in particular the one described in Article 8 of these terms (services fully performed with prior express agreement).
legal.cgv.art8.titre=Article 8 — Fully performed services
legal.cgv.art8.corps=Where the customer asks for a service to be performed before the withdrawal period ends, they are offered the option of expressly acknowledging that they will lose that right once the service has been fully performed. This waiver is optional, is never pre-ticked, and evidence of it is retained. As long as the service has not been fully performed, the right of withdrawal remains.
legal.cgv.art9.titre=Article 9 — Invoice
legal.cgv.art9.corps=An invoice is issued for every paid order and made available as a PDF in the member area. Invoices are numbered continuously and without gaps, per financial year. They are kept for seven years, in accordance with value added tax legislation.
legal.cgv.art10.titre=Article 10 — Legal guarantee of conformity
legal.cgv.art10.completer=For goods sold to a consumer, the two-year legal guarantee of conformity applies (Articles 1649bis et seq. of the former Civil Code, now incorporated into Book 5 of the new Civil Code). This guarantee is owed by the seller, that is to say the garage. For services (servicing, repair, diagnosis, etc.), the garage is bound by an ordinary-law obligation of conformity: the service must match what was agreed; that obligation carries no fixed duration but remains framed by the rules on limitation periods. This legal guarantee applies irrespective of any commercial warranty.
legal.cgv.art11.titre=Article 11 — Liability
legal.cgv.art11.completer=The garage is liable for the proper performance of the services sold, under the conditions of the general law (Book 6 of the Civil Code, in force since 1 January 2025) and of these terms. The information published on the site is provided for guidance; the garage endeavours to keep it accurate and up to date without guaranteeing that it is exhaustive or free of error. The liability of the garage may in no case be excluded or limited in the event of gross negligence, fraud, harm to life or physical integrity, nor for mandatory legal obligations — in particular the legal guarantee of conformity and the safety of products and services. The garage assumes no liability for the content of third-party sites reachable through links, over which it exercises no control.
legal.cgv.art12.titre=Article 12 — Personal data
legal.cgv.art12.corps=The processing of personal data is described in the privacy policy, which is reachable from every page of the site.
legal.cgv.art13.titre=Article 13 — Applicable law and disputes
legal.cgv.art13.completer=These terms are governed by Belgian law. In the event of a dispute, the parties will seek an amicable solution before any legal action. The consumer is informed of the existence of the Consumer Mediation Service (Boulevard du Roi Albert II 8, 1000 Brussels — mediationconsommateur.be) and, for online purchases, of the European online dispute resolution platform (ec.europa.eu/consumers/odr). Failing an amicable settlement, the Belgian courts have jurisdiction; the consumer retains the benefit of the protective rules allowing them, where applicable, to bring proceedings before the court of their place of domicile.
legal.mentions.titre=Legal notice
legal.mentions.editeur.titre=Site publisher
legal.mentions.responsable.titre=Publishing manager
legal.mentions.responsable.completer=The person responsible for the publication of this site is the legal representative of the garage, {0} ({1}), whose registered office is at {2}. Company number (CBE): {3} — VAT number: {4}. Contact: {5} — {6}.
legal.mentions.hebergeur.titre=Hosting provider
legal.mentions.hebergeur.completer=The site is hosted by Hetzner Online GmbH, Industriestr. 25, 91710 Gunzenhausen, Germany — telephone: +49 (0)9831 505-0 — website: www.hetzner.com. The servers used are located within the European Union.
legal.mentions.propriete.titre=Intellectual property
legal.mentions.propriete.completer=All elements of the site (texts, images, graphics, logo, structure, layout) are protected by intellectual property law and remain the exclusive property of the garage or its partners. Any reproduction, representation, distribution or exploitation, in whole or in part, without prior written authorisation, is prohibited. The underlying technical platform and its source code remain the property of their publisher, AutoServ+.
legal.mentions.profession.titre=Access to the profession and insurance
legal.mentions.profession.completer=The garage declares that it carries on its activity in accordance with the Belgian rules applicable to its profession. Information on its professional insurance (in particular civil liability) and on its access to the profession is available from the garage on simple request, at the contact details given above.
legal.mentions.contact.titre=Contact
legal.mentions.contact.corps=Any question about the site or about an order may be addressed to the garage by e-mail or by telephone, using the details shown above.
legal.mentions.liens.titre=Related documents
legal.confidentialite.titre=Privacy policy
legal.confidentialite.intro=This policy describes the processing of personal data carried out by the garage through the AutoServ+ platform. It is the public counterpart of the register attached to the export of your data: both are produced from the same source, and therefore cannot diverge.
legal.confidentialite.responsable.titre=Data controller
legal.confidentialite.dpo.titre=Data protection officer
legal.confidentialite.dpo.completer=Given the nature and volume of the processing carried out, no data protection officer (DPO) has been appointed, such an appointment not being mandatory within the meaning of Article 37 of the GDPR. For any question, or to exercise your rights (access, rectification, erasure, portability, objection), you may contact the garage at {0}. You also have the right to lodge a complaint with the Data Protection Authority (DPA), rue de la Presse 35, 1000 Brussels — autoriteprotectiondonnees.be.
legal.confidentialite.finalites.titre=Purposes and legal bases
legal.confidentialite.finalites.colonne.finalite=Purpose
legal.confidentialite.finalites.colonne.base=Legal basis
legal.confidentialite.categories.titre=Categories of data processed
legal.confidentialite.destinataires.titre=Recipients and processors
legal.confidentialite.destinataires.colonne.nom=Recipient
legal.confidentialite.destinataires.colonne.role=Role
legal.confidentialite.destinataires.colonne.pays=Country
legal.confidentialite.transferts.titre=Transfers outside the European Union
legal.confidentialite.transferts.completer=All your data is hosted and processed within the European Union. Our technical providers are established in the Union: payment is handled by Mollie (Netherlands), e-mail delivery by Brevo (France) and hosting by Hetzner (Germany). No transfer of your personal data takes place outside the European Union.
legal.confidentialite.durees.titre=Retention periods
legal.confidentialite.durees.colonne.donnees=Data
legal.confidentialite.durees.colonne.duree=Period
legal.confidentialite.durees.comptable=Accounting documents already issued — invoices and credit notes — are neither altered nor deleted when an account is deleted: keeping them rests on a legal obligation, which sets aside the right to erasure for those documents alone (Article 17.3.b of the Regulation). The member record itself is anonymised.
legal.confidentialite.droits.titre=Your rights
legal.confidentialite.droits.colonne.droit=Right
legal.confidentialite.droits.colonne.article=Basis
legal.confidentialite.exercice.titre=How to exercise your rights
legal.confidentialite.exercice.corps=From the "My personal data" section of your account you can download all of your data in a structured format and request the deletion of your account. Both operations require you to enter your password.
legal.confidentialite.cookies.titre=Cookies
legal.confidentialite.cookies.corps=The platform sets cookies that are strictly necessary for it to work. Optional purposes are subject to your consent, collected purpose by purpose and changeable at any time.
legal.confidentialite.securite.titre=Security
legal.confidentialite.securite.corps=Passwords are stored as a non-reversible hash. Traffic to and from the site is encrypted in transit. Access to the back office is restricted to garage staff.

