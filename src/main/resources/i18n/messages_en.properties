# --- Legal documents (terms of sale, legal notice, privacy policy) ---
legal.brouillon.titre=Draft document
legal.brouillon.texte=This text is a draft, written from the actual behaviour of the platform. It must be reviewed by a lawyer before going into production. The passages marked in brackets still have to be completed.
