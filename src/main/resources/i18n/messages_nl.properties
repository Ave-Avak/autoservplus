courriel.verification-adresse.corps=Bevestig uw adres via deze link, 24 uur geldig, om uw account te activeren:\n{0}\n\nHebt u geen account aangemaakt? Negeer dan dit bericht.
courriel.rappel-verification.sujet=Uw account is nog niet geactiveerd
courriel.rappel-verification.corps=Er werd een aanvraag gedaan voor dit adres, maar uw account werd nooit geactiveerd. Activeer het via deze link, 24 uur geldig:\n{0}
courriel.tentative-inscription.sujet=Er werd geprobeerd een account aan te maken met uw adres
courriel.tentative-inscription.corps=Iemand heeft geprobeerd een account aan te maken met uw e-mailadres. U hebt er al een, en er werd geen ander aangemaakt.\n\nWas u het zelf? Meld u dan aan:\n{0}\n\nBent u uw wachtwoord vergeten? Vraag dan een nieuw aan:\n{1}\n\nWas u het niet? Negeer dan dit bericht: uw account werd niet gewijzigd.
courriel.reinitialisation.sujet=Kies een nieuw wachtwoord
courriel.reinitialisation.corps=Volg deze link, één uur en één keer geldig, om een nieuw wachtwoord te kiezen:\n{0}\n\nHebt u dit niet zelf gevraagd? Negeer dan dit bericht: uw wachtwoord blijft ongewijzigd.
courriel.definition-mot-de-passe.sujet=Uw beheerdersaccount
courriel.definition-mot-de-passe.corps=Er werd een beheerdersaccount op uw naam aangemaakt. Kies uw wachtwoord via deze link, 24 uur en één keer geldig:\n{0}
courriel.verrouillage-second-facteur.sujet=Uw account is vergrendeld
courriel.verrouillage-second-facteur.corps=Na uw wachtwoord werden vijf onjuiste verificatiecodes ingevoerd. Uw account is vergrendeld tot {0} om {1}.\nWas u dit niet? Dan kent iemand anders uw wachtwoord: wijzig het zo snel mogelijk.
courriel.verrouillage-connexion.sujet=Uw account is vergrendeld
courriel.verrouillage-connexion.corps=Voor uw account werden vijf onjuiste wachtwoorden ingevoerd. Het is vergrendeld tot {0} om {1}.\nWas u dit niet? Dan hoeft u niets te doen. Wilt u meteen weer toegang, kies dan een nieuw wachtwoord via de aanmeldpagina.
courriel.second-facteur-reinitialise.sujet=Uw tweede factor werd opnieuw ingesteld
courriel.second-facteur-reinitialise.corps=Een superbeheerder heeft uw tweede factor opnieuw ingesteld. Uw herstelcodes zijn niet langer geldig en uw open sessies werden afgesloten.\nHebt u dit niet gevraagd? Neem dan contact op met de garage.
courriel.nouvelle-adresse.sujet=Bevestig uw nieuwe adres
courriel.nouvelle-adresse.corps=Bevestig dit adres via deze link, twee uur geldig, zodat het {0} in uw account vervangt:\n{1}\n\nZonder bevestiging blijft uw account bereikbaar op uw huidige adres.
courriel.avis-changement-adresse.sujet=Aanvraag tot adreswijziging voor uw account
courriel.avis-changement-adresse.corps=Er werd voor uw account een wijziging van het adres naar {0} aangevraagd.\nHebt u dit niet zelf gedaan? Meld u dan aan en wijzig uw wachtwoord: de aanvraag wordt dan geannuleerd.
courriel.compte-supprime.sujet=Uw account is verwijderd
courriel.compte-supprime.corps=Uw account werd verwijderd. Uw persoonsgegevens werden gewist en uw toegang ingetrokken.\nUw facturen worden tien jaar bewaard, zoals de wet voorschrijft (artikel 60 van het Btw-wetboek). Ze identificeren u niet langer in de toepassing.
courriel.rdv-confirme.sujet=Uw afspraak is bevestigd
courriel.rdv-confirme.corps=Uw afspraak {0} op {1} om {2} is bevestigd.
courriel.rdv-confirme.agenda=Met het bijgevoegde bestand zet u hem in uw agenda.
courriel.rdv-refuse.sujet=Uw aanvraag voor een afspraak kon niet worden aanvaard
courriel.rdv-refuse.corps=Uw aanvraag voor afspraak {0} op {1} om {2} kon niet worden aanvaard.\nReden: {3}
