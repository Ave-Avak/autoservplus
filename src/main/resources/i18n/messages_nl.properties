legal.mentions.responsable.titre=Verantwoordelijke uitgever
legal.mentions.responsable.completer=De verantwoordelijke uitgever van deze site is de wettelijke vertegenwoordiger van de garage, {0} ({1}), met zetel te {2}. Ondernemingsnummer (KBO): {3} — Btw-nummer: {4}. Contact: {5} — {6}.
legal.mentions.hebergeur.titre=Hostingpartij
legal.mentions.hebergeur.completer=De site wordt gehost door Hetzner Online GmbH, Industriestr. 25, 91710 Gunzenhausen, Duitsland — telefoon: +49 (0)9831 505-0 — site: www.hetzner.com. De gebruikte servers bevinden zich binnen de Europese Unie.
legal.mentions.propriete.titre=Intellectuele eigendom
legal.mentions.propriete.completer=Alle onderdelen van de site (teksten, afbeeldingen, grafische elementen, logo, structuur, vormgeving) zijn beschermd door het intellectuele-eigendomsrecht en blijven de exclusieve eigendom van de garage of van haar partners. Elke reproductie, weergave, verspreiding of exploitatie, geheel of gedeeltelijk, zonder voorafgaande schriftelijke toestemming, is verboden. Het onderliggende technische platform en de broncode ervan blijven eigendom van de uitgever ervan, AutoServ+.
legal.mentions.profession.titre=Toegang tot het beroep en verzekeringen
legal.mentions.profession.completer=De garage verklaart haar activiteit uit te oefenen overeenkomstig de Belgische regelgeving die op haar beroep van toepassing is. De informatie over haar beroepsverzekeringen (met name burgerlijke aansprakelijkheid) en over haar toegang tot het beroep is op eenvoudig verzoek bij de garage verkrijgbaar, op de hierboven vermelde contactgegevens.
legal.mentions.contact.titre=Contact
legal.mentions.contact.corps=Elke vraag over de site of over een bestelling kan aan de garage worden gericht per e-mail of per telefoon, op de hierboven vermelde gegevens.
legal.mentions.liens.titre=Verwante documenten
legal.confidentialite.titre=Privacybeleid
legal.confidentialite.intro=Dit beleid beschrijft de verwerkingen van persoonsgegevens die de garage via het platform AutoServ+ uitvoert. Het is de publieke tegenhanger van het register dat bij de export van uw gegevens wordt gevoegd: beide worden uit dezelfde bron opgesteld en kunnen dus niet van elkaar afwijken.
legal.confidentialite.responsable.titre=Verwerkingsverantwoordelijke
legal.confidentialite.dpo.titre=Functionaris voor gegevensbescherming
legal.confidentialite.dpo.completer=Gelet op de aard en de omvang van de uitgevoerde verwerkingen is geen functionaris voor gegevensbescherming (DPO) aangesteld; die aanstelling is niet verplicht in de zin van artikel 37 van de AVG. Voor elke vraag of om uw rechten uit te oefenen (inzage, verbetering, wissing, overdraagbaarheid, bezwaar) kunt u de garage contacteren op het adres {0}. U hebt eveneens het recht een klacht in te dienen bij de Gegevensbeschermingsautoriteit (GBA), Drukpersstraat 35, 1000 Brussel — gegevensbeschermingsautoriteit.be.
