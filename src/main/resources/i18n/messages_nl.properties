legal.cgv.titre=Algemene verkoopvoorwaarden
legal.cgv.intro=Deze voorwaarden zijn van toepassing op de verkoop van onderdelen en werkplaatsdiensten via het platform AutoServ+.
legal.cgv.art1.titre=Artikel 1 — Verkoper
legal.cgv.art1.corps=De verkoper is de hieronder vermelde garage, ingeschreven bij de Kruispuntbank van Ondernemingen en btw-plichtig.
legal.cgv.art2.titre=Artikel 2 — Toepassingsgebied en aanvaarding
legal.cgv.art2.corps=Elke bestelling op het platform veronderstelt de voorafgaande en uitdrukkelijke aanvaarding van deze voorwaarden. Die aanvaarding wordt verzameld via een aankruisvakje op het besteloverzicht; zij wordt met tijdstempel bewaard, samen met de aanvaarde versie van het document en het gebruikte IP-adres.
legal.cgv.art3.titre=Artikel 3 — Prijzen en belasting over de toegevoegde waarde
legal.cgv.art3.corps=De prijzen worden vermeld in euro, exclusief en inclusief belasting. De toegepaste tarieven zijn de Belgische tarieven van 0, 6, 12 en 21 %. De prijs, de omschrijving en het belastingtarief van een artikel worden vastgelegd op het ogenblik waarop het aan het winkelmandje wordt toegevoegd: een latere wijziging van de catalogus heeft geen invloed op een reeds samengesteld mandje.
legal.cgv.art4.titre=Artikel 4 — Bestelling
legal.cgv.art4.corps=De bestelling komt in drie stappen tot stand: samenstelling van het mandje, overzicht met de details van de lijnen en de bedragen, en vervolgens bevestiging. De bevestigingsknop vermeldt uitdrukkelijk dat de bestelling een betalingsverplichting inhoudt. Een mandje kan uitsluitend onderdelen of uitsluitend diensten bevatten, nooit beide tegelijk.
legal.cgv.art5.titre=Artikel 5 — Betaling
legal.cgv.art5.corps=De betaling verloopt online via een betaaldienstaanbieder. Er worden door de garage geen kaartgegevens verzameld of bewaard. De bestelling geldt pas als betaald na bevestiging van de status door de dienstverlener.
legal.cgv.art6.titre=Artikel 6 — Afhaling en uitvoering
legal.cgv.art6.corps=Bestelde onderdelen worden in de garage afgehaald; er wordt geen verzending aangeboden. De online aankoop van een dienst reserveert geen tijdslot: de garage opent het werkplaatsdossier en spreekt de datum af met de klant.
legal.cgv.art6.completer=De bestelde goederen (onderdelen, accessoires) worden ter plaatse afgehaald, op het adres van de garage vermeld in artikel 1; er wordt geen verzending aangeboden. De diensten worden uitgevoerd in de werkplaats van de garage, op de bij de reservatie afgesproken datum of, bij gebreke daarvan, binnen een redelijke termijn die aan de klant wordt meegedeeld. De voorziene uitvoeringsdatum wordt herhaald in het besteloverzicht en in de bevestigingsmail, die de duurzame gegevensdrager van de precontractuele informatie vormt (artikel VI.45 §7 van het Wetboek van economisch recht).
legal.cgv.art7.titre=Artikel 7 — Herroepingsrecht
legal.cgv.art7.corps=De consument beschikt over een termijn van {0} dagen om zich te herroepen, zonder opgave van reden. Deze termijn loopt vanaf het sluiten van de bestelling. De aanvraag wordt ingediend vanuit de ledenruimte; de garage onderzoekt ze en deelt haar beslissing mee. Bij aanvaarding wordt een creditnota opgesteld en gebeurt de terugbetaling via hetzelfde betaalmiddel als bij de aankoop.
legal.cgv.art7.completer=De consument kan zijn herroepingsrecht uitoefenen zonder opgave van reden en zonder boete (artikel VI.47 van het Wetboek van economisch recht). Om het uit te oefenen, deelt hij zijn beslissing aan de garage mee door middel van een ondubbelzinnige verklaring (brief of e-mail naar de contactgegevens van artikel 1), of met het modelformulier voor herroeping dat hem ter beschikking wordt gesteld, downloadbaar en toegankelijk via een permanente link in zijn ledenruimte. De garage betaalt alle gestorte bedragen terug binnen veertien dagen na ontvangst van de herroeping, met hetzelfde betaalmiddel als dat van de bestelling, tenzij de consument uitdrukkelijk met een ander middel instemt. Dit recht geldt niet in de uitsluitingsgevallen bepaald in artikel VI.53 van het Wetboek van economisch recht, met name het geval beschreven in artikel 8 van deze voorwaarden (volledig uitgevoerde diensten met voorafgaande uitdrukkelijke instemming).
legal.cgv.art8.titre=Artikel 8 — Volledig uitgevoerde diensten
legal.cgv.art8.corps=Wanneer de klant vraagt dat een dienst wordt uitgevoerd vóór het verstrijken van de herroepingstermijn, wordt hem voorgesteld uitdrukkelijk te erkennen dat hij dat recht verliest zodra de dienst volledig is uitgevoerd. Die afstand is facultatief, wordt nooit vooraf aangevinkt, en het bewijs ervan wordt bewaard. Zolang de dienst niet volledig is uitgevoerd, blijft het herroepingsrecht bestaan.
legal.cgv.art9.titre=Artikel 9 — Factuur
legal.cgv.art9.corps=Voor elke betaalde bestelling wordt een factuur opgesteld en in pdf-formaat ter beschikking gesteld in de ledenruimte. De facturen worden per boekjaar doorlopend en zonder onderbreking genummerd. Zij worden zeven jaar bewaard, overeenkomstig de btw-wetgeving.
legal.cgv.art10.titre=Artikel 10 — Wettelijke conformiteitsgarantie
legal.cgv.art10.completer=Voor goederen die aan de consument worden verkocht, geldt de wettelijke conformiteitsgarantie van twee jaar (artikelen 1649bis en volgende van het oud Burgerlijk Wetboek, thans opgenomen in boek 5 van het nieuw Burgerlijk Wetboek). Deze garantie is verschuldigd door de verkoper, dat wil zeggen de garage. Voor de diensten (onderhoud, herstelling, diagnose, enz.) rust op de garage een gemeenrechtelijke conformiteitsverplichting: de dienst moet overeenstemmen met wat is overeengekomen; aan die verplichting is geen vaste duur verbonden, maar zij blijft omkaderd door de verjaringsregels. Deze wettelijke garantie geldt ongeacht enige commerciële waarborg.
legal.cgv.art11.titre=Artikel 11 — Aansprakelijkheid
legal.cgv.art11.completer=De garage is aansprakelijk voor de goede uitvoering van de verkochte prestaties, onder de voorwaarden van het gemeen recht (boek 6 van het Burgerlijk Wetboek, in werking getreden op 1 januari 2025) en van deze voorwaarden. De op de site gepubliceerde informatie wordt ter indicatie verstrekt; de garage streeft ernaar ze juist en actueel te houden zonder de volledigheid ervan of de afwezigheid van fouten te waarborgen. De aansprakelijkheid van de garage kan in geen geval worden uitgesloten of beperkt in geval van zware fout, bedrog, aantasting van het leven of de lichamelijke integriteit, noch voor de dwingende wettelijke verplichtingen — met name de wettelijke conformiteitsgarantie en de veiligheid van producten en diensten. De garage draagt geen enkele aansprakelijkheid voor de inhoud van sites van derden die via links toegankelijk zijn en waarover zij geen enkele controle uitoefent.
legal.cgv.art12.titre=Artikel 12 — Persoonsgegevens
legal.cgv.art12.corps=De verwerking van persoonsgegevens wordt beschreven in het privacybeleid, dat vanaf elke pagina van de site toegankelijk is.
legal.cgv.art13.titre=Artikel 13 — Toepasselijk recht en geschillen
legal.cgv.art13.completer=Deze voorwaarden worden beheerst door het Belgisch recht. Bij een geschil zoeken de partijen een minnelijke oplossing vóór elke gerechtelijke stap. De consument wordt ingelicht over het bestaan van de Consumentenombudsdienst (Koning Albert II-laan 8, 1000 Brussel — consumentenombudsdienst.be) en, voor onlineaankopen, over het Europese platform voor onlinegeschillenbeslechting (ec.europa.eu/consumers/odr). Bij gebrek aan een minnelijke regeling zijn de Belgische hoven en rechtbanken bevoegd; de consument behoudt het voordeel van de beschermende regels die hem in voorkomend geval toelaten de rechtbank van zijn woonplaats te vatten.
legal.mentions.titre=Wettelijke vermeldingen
