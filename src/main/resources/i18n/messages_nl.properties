courriel.confirmation-commande.corps=Uw betaling van {1} is ontvangen op {3}. Deze e-mail bevestigt op een duurzame gegevensdrager de overeenkomst die op {2} werd gesloten voor bestelling {0} (artikel VI.46, § 7, van het Wetboek van economisch recht). Bewaar hem samen met de bijlagen.
