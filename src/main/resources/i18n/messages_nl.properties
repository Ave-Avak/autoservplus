courriel.confirmation-commande.garantie=Wettelijke garantie
courriel.confirmation-commande.garantie.corps=De onderdelen genieten de wettelijke conformiteitsgarantie van twee jaar (artikelen 1649bis tot 1649nonies van het oud Burgerlijk Wetboek). De garage biedt geen handelsgarantie en geen afzonderlijke dienst na verkoop aan naast deze wettelijke garantie.
