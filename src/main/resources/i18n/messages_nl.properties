legal.cgv.titre=Algemene verkoopvoorwaarden
legal.cgv.intro=Deze voorwaarden zijn van toepassing op de verkoop van onderdelen en werkplaatsdiensten via het platform AutoServ+.
legal.cgv.art1.titre=Artikel 1. Verkoper
legal.cgv.art1.corps=De verkoper is de hieronder vermelde garage, ingeschreven bij de Kruispuntbank van Ondernemingen en btw-plichtig.
legal.cgv.art2.titre=Artikel 2. Toepassingsgebied en aanvaarding
legal.cgv.art2.corps=Elke bestelling op het platform veronderstelt de voorafgaande en uitdrukkelijke aanvaarding van deze voorwaarden. Die aanvaarding wordt verzameld via een aankruisvakje op het besteloverzicht. Zij wordt met tijdstempel bewaard, samen met de aanvaarde versie van het document en het gebruikte IP-adres.
legal.cgv.art3.titre=Artikel 3. Prijzen en belasting over de toegevoegde waarde
legal.cgv.art3.corps=De prijzen worden vermeld in euro, exclusief en inclusief belasting. De toegepaste tarieven zijn de Belgische tarieven van 0, 6, 12 en 21 %. De prijs, de omschrijving en het belastingtarief van een artikel worden vastgelegd op het ogenblik waarop het aan het winkelmandje wordt toegevoegd: een latere wijziging van de catalogus heeft geen invloed op een reeds samengesteld mandje.
legal.cgv.art4.titre=Artikel 4. Bestelling
legal.cgv.art4.corps=De bestelling komt in drie stappen tot stand: samenstelling van het mandje, overzicht met de details van de lijnen en de bedragen, en vervolgens bevestiging. De bevestigingsknop vermeldt uitdrukkelijk dat de bestelling een betalingsverplichting inhoudt. Een mandje kan uitsluitend onderdelen of uitsluitend diensten bevatten, nooit beide tegelijk.
legal.cgv.art5.titre=Artikel 5. Betaling
legal.cgv.art5.corps=De betaling verloopt online via een betaaldienstaanbieder. Er worden door de garage geen kaartgegevens verzameld of bewaard. De bestelling geldt pas als betaald na bevestiging van de status door de dienstverlener.
legal.cgv.art6.titre=Artikel 6. Afhaling en uitvoering
legal.cgv.art6.corps=Bestelde onderdelen worden in de garage afgehaald, op het adres vermeld in artikel 1. Er wordt geen verzending aangeboden. Ze worden uiterlijk dertig dagen na de sluiting van de bestelling ter beschikking van de klant gesteld, tenzij met hem een andere datum is overeengekomen (artikel VI.43, § 1, van het Wetboek van economisch recht).
legal.cgv.art6.completer=De online aankoop van een dienst reserveert geen tijdslot: de garage opent het werkplaatsdossier en spreekt met de klant de uitvoeringsdatum af. De dienst wordt op die datum in de werkplaats van de garage uitgevoerd.
legal.cgv.art6.confirmation=De e-mail ter bevestiging van de bestelling herneemt op een duurzame gegevensdrager de informatie bedoeld in artikel VI.46, § 7, van het Wetboek van economisch recht.
legal.cgv.art7.titre=Artikel 7. Herroepingsrecht
legal.cgv.art7.entree=In dit artikel duidt “wij” de garage aan en “u” de consument.
legal.cgv.art7.droit=U heeft het recht om binnen een termijn van 14 dagen zonder opgave van redenen de overeenkomst te herroepen.
legal.cgv.art7.delai=De herroepingstermijn verstrijkt 14 dagen na de dag van de sluiting van de overeenkomst, voor een dienst. Voor een aankoop van onderdelen verstrijkt hij 14 dagen na de dag waarop u of een door u aangewezen derde, die niet de vervoerder is, het goed fysiek in bezit krijgt. Als onderdelen van eenzelfde bestelling u afzonderlijk worden overhandigd, verstrijkt hij 14 dagen na de dag waarop u of een door u aangewezen derde, die niet de vervoerder is, het laatste goed fysiek in bezit krijgt.
legal.cgv.art7.notification=Om het herroepingsrecht uit te oefenen, moet u ons, op de gegevens vermeld in artikel 1 (naam, geografisch adres, telefoonnummer en e-mailadres), via een ondubbelzinnige verklaring (bijvoorbeeld schriftelijk per post of e-mail) op de hoogte stellen van uw beslissing de overeenkomst te herroepen. U kunt hiervoor gebruikmaken van het bijgevoegde modelformulier voor herroeping, maar bent hiertoe niet verplicht.
legal.cgv.art7.en-ligne=U kunt uw herroepingsrecht ook online uitoefenen op de pagina “Mijn bestellingen” van uw ledenruimte, via de link “Hier de overeenkomst herroepen”. Indien u deze onlinefunctie gebruikt, sturen wij u onverwijld een ontvangstbevestiging van de herroeping op een duurzame gegevensdrager (bv. per e-mail), met vermelding van de inhoud en de datum en het tijdstip van indiening daarvan.
legal.cgv.art7.respect=Om de herroepingstermijn na te leven volstaat het om uw mededeling betreffende uw uitoefening van het herroepingsrecht te verzenden voordat de herroepingstermijn is verstreken.
legal.cgv.art7.effets.titre=Gevolgen van de herroeping
legal.cgv.art7.effets=Als u de overeenkomst herroept, ontvangt u alle betalingen die u tot op dat moment heeft gedaan, inclusief leveringskosten (met uitzondering van eventuele extra kosten ten gevolge van uw keuze voor een andere wijze van levering dan de door ons geboden goedkoopste standaard levering) onverwijld en in ieder geval niet later dan 14 dagen nadat wij op de hoogte zijn gesteld van uw beslissing de overeenkomst te herroepen, van ons terug. Wij betalen u terug met hetzelfde betaalmiddel als waarmee u de oorspronkelijke transactie heeft verricht, tenzij u uitdrukkelijk anderszins heeft ingestemd; in ieder geval zullen u voor zulke terugbetaling geen kosten in rekening worden gebracht.
legal.cgv.art7.suite=Wij brengen u per e-mail op de hoogte van het gevolg dat aan uw herroeping wordt gegeven. Wij weigeren ze alleen als de herroepingstermijn verstreken is, of als een van de uitzonderingen van artikel VI.53 van het Wetboek van economisch recht van toepassing is, met name die van artikel 8. Voor het terugbetaalde bedrag wordt een creditnota opgemaakt.
legal.cgv.art7.pieces.titre=Als u onderdelen heeft gekocht
legal.cgv.art7.pieces.differer=Wij mogen wachten met terugbetaling tot wij de goederen hebben teruggekregen, of u heeft aangetoond dat u de goederen heeft teruggezonden, al naar gelang welk tijdstip eerst valt.
legal.cgv.art7.pieces.renvoi=U dient de goederen onverwijld, doch in ieder geval niet later dan 14 dagen na de dag waarop u het besluit de overeenkomst te herroepen aan ons heeft medegedeeld, aan ons, op het adres vermeld in artikel 1, terug te zenden of te overhandigen. U bent op tijd als u de goederen terugstuurt voordat de termijn van 14 dagen is verstreken.
legal.cgv.art7.pieces.frais=Wij zullen de kosten van het terugzenden van de goederen voor onze rekening nemen.
legal.cgv.art7.pieces.responsabilite=U bent alleen aansprakelijk voor de waardevermindering van de goederen die het gevolg is van het gebruik van de goederen, dat verder gaat dan nodig is om de aard, de kenmerken en de werking van de goederen vast te stellen.
legal.cgv.art7.prestation.titre=Als u een dienst heeft besteld
legal.cgv.art7.prestation.montant=Als u heeft verzocht om de verrichting van diensten te laten beginnen tijdens de herroepingstermijn, betaalt u een bedrag dat evenredig is aan hetgeen op het moment dat u ons ervan in kennis heeft gesteld dat u de overeenkomst herroept reeds geleverd is, vergeleken met de volledige uitvoering van de overeenkomst.
legal.cgv.art8.titre=Artikel 8. Volledig uitgevoerde diensten
legal.cgv.art8.corps=Wanneer de klant vraagt dat een dienst wordt uitgevoerd vóór het verstrijken van de herroepingstermijn, wordt hem voorgesteld uitdrukkelijk te erkennen dat hij dat recht verliest zodra de dienst volledig is uitgevoerd. Die afstand is facultatief, wordt nooit vooraf aangevinkt, en het bewijs ervan wordt bewaard. Zolang de dienst niet volledig is uitgevoerd, blijft het herroepingsrecht bestaan.
legal.cgv.art9.titre=Artikel 9. Factuur
legal.cgv.art9.corps=Voor elke betaalde bestelling wordt een factuur opgesteld en in pdf-formaat ter beschikking gesteld in de ledenruimte. De facturen worden per boekjaar doorlopend en zonder onderbreking genummerd. Zij worden tien jaar bewaard, overeenkomstig de btw-wetgeving.
legal.cgv.art10.titre=Artikel 10. Wettelijke conformiteitsgarantie
legal.cgv.art10.completer=Voor goederen die aan de consument worden verkocht, geldt de wettelijke conformiteitsgarantie van twee jaar (artikelen 1649bis en volgende van het oud Burgerlijk Wetboek, thans opgenomen in boek 5 van het nieuw Burgerlijk Wetboek). Deze garantie is verschuldigd door de verkoper, dat wil zeggen de garage. Voor de diensten (onderhoud, herstelling, diagnose, enz.) rust op de garage een gemeenrechtelijke conformiteitsverplichting: de dienst moet overeenstemmen met wat is overeengekomen. Aan die verplichting is geen vaste duur verbonden, maar zij blijft omkaderd door de verjaringsregels. Deze wettelijke garantie geldt ongeacht enige commerciële waarborg. De garage biedt geen handelsgarantie en geen afzonderlijke dienst na verkoop aan naast deze wettelijke garanties.
legal.cgv.art11.titre=Artikel 11. Aansprakelijkheid
legal.cgv.art11.completer=De garage is aansprakelijk voor de goede uitvoering van de verkochte prestaties, onder de voorwaarden van het gemeen recht (boek 6 van het Burgerlijk Wetboek, in werking getreden op 1 januari 2025) en van deze voorwaarden. De op de site gepubliceerde informatie wordt ter indicatie verstrekt. De garage streeft ernaar ze juist en actueel te houden zonder de volledigheid ervan of de afwezigheid van fouten te waarborgen. De aansprakelijkheid van de garage kan in geen geval worden uitgesloten of beperkt in geval van zware fout, bedrog, aantasting van het leven of de lichamelijke integriteit, noch voor de dwingende wettelijke verplichtingen (met name de wettelijke conformiteitsgarantie en de veiligheid van producten en diensten). De garage draagt geen enkele aansprakelijkheid voor de inhoud van sites van derden die via links toegankelijk zijn en waarover zij geen enkele controle uitoefent.
legal.cgv.art12.titre=Artikel 12. Persoonsgegevens
legal.cgv.art12.corps=De verwerking van persoonsgegevens wordt beschreven in het privacybeleid, dat vanaf elke pagina van de site toegankelijk is.
legal.cgv.art13.titre=Artikel 13. Toepasselijk recht en geschillen
legal.cgv.art13.completer=Deze voorwaarden worden beheerst door het Belgisch recht. Klachten worden gericht aan de garage, op de gegevens vermeld in artikel 1. Bij een geschil zoeken de partijen een minnelijke oplossing vóór elke gerechtelijke stap. De consument kan zich wenden tot de Consumentenombudsdienst (Koning Albert II-laan 8, 1000 Brussel, website: consumentenombudsdienst.be). Bij gebrek aan een minnelijke regeling zijn de Belgische hoven en rechtbanken bevoegd. De consument behoudt evenwel het voordeel van de beschermende regels die hem in voorkomend geval toelaten de rechtbank van zijn woonplaats te vatten.
legal.mentions.titre=Wettelijke vermeldingen
legal.mentions.editeur.titre=Uitgever van de site
legal.mentions.responsable.titre=Verantwoordelijke uitgever
legal.mentions.responsable.completer=De verantwoordelijke uitgever van deze site is de wettelijke vertegenwoordiger van de garage, {0} ({1}), met zetel te {2}. Ondernemingsnummer (KBO): {3}. Btw-nummer: {4}. Contact: {5}, {6}.
legal.mentions.hebergeur.titre=Hostingpartij
legal.mentions.hebergeur.completer=De site wordt gehost door Hetzner Online GmbH, Industriestr. 25, 91710 Gunzenhausen, Duitsland. Telefoon: +49 (0)9831 505-0. Site: www.hetzner.com. De gebruikte servers bevinden zich binnen de Europese Unie.
legal.mentions.propriete.titre=Intellectuele eigendom
legal.mentions.propriete.completer=Alle onderdelen van de site (teksten, afbeeldingen, grafische elementen, logo, structuur, vormgeving) zijn beschermd door het intellectuele-eigendomsrecht en blijven de exclusieve eigendom van de garage of van haar partners. Elke reproductie, weergave, verspreiding of exploitatie, geheel of gedeeltelijk, zonder voorafgaande schriftelijke toestemming, is verboden. Het onderliggende technische platform en de broncode ervan blijven eigendom van de uitgever ervan, AutoServ+.
legal.mentions.profession.titre=Toegang tot het beroep en verzekeringen
legal.mentions.profession.completer=De garage verklaart haar activiteit uit te oefenen overeenkomstig de Belgische regelgeving die op haar beroep van toepassing is. De informatie over haar beroepsverzekeringen (met name burgerlijke aansprakelijkheid) en over haar toegang tot het beroep is op eenvoudig verzoek bij de garage verkrijgbaar, op de hierboven vermelde contactgegevens.
legal.mentions.contact.titre=Contact
legal.mentions.contact.corps=Elke vraag over de site of over een bestelling kan aan de garage worden gericht per e-mail of per telefoon, op de hierboven vermelde gegevens.
legal.mentions.liens.titre=Verwante documenten
legal.confidentialite.titre=Privacybeleid
legal.confidentialite.intro=Dit beleid beschrijft de verwerkingen van persoonsgegevens die de garage via het platform AutoServ+ uitvoert. Het is de publieke tegenhanger van het register dat bij de export van uw gegevens wordt gevoegd: beide worden uit dezelfde bron opgesteld en kunnen dus niet van elkaar afwijken.
legal.confidentialite.responsable.titre=Verwerkingsverantwoordelijke
legal.confidentialite.dpo.titre=Functionaris voor gegevensbescherming
legal.confidentialite.dpo.completer=Gelet op de aard en de omvang van de uitgevoerde verwerkingen is geen functionaris voor gegevensbescherming (DPO) aangesteld. Die aanstelling is niet verplicht in de zin van artikel 37 van de AVG. Voor elke vraag of om uw rechten uit te oefenen (inzage, verbetering, wissing, overdraagbaarheid, bezwaar) kunt u de garage contacteren op het adres {0}. U hebt eveneens het recht een klacht in te dienen bij de Gegevensbeschermingsautoriteit (GBA), Drukpersstraat 35, 1000 Brussel, website: gegevensbeschermingsautoriteit.be.
legal.confidentialite.finalites.titre=Doeleinden en rechtsgronden
legal.confidentialite.finalites.colonne.finalite=Doeleinde
legal.confidentialite.finalites.colonne.base=Rechtsgrond
