legal.brouillon.titre=Voorlopig document
legal.brouillon.texte=Deze tekst is een ontwerp, opgesteld op basis van de werkelijke werking van het platform. Hij moet juridisch worden nagekeken voordat hij in productie gaat. De tussen haakjes aangeduide passages moeten nog worden aangevuld.
