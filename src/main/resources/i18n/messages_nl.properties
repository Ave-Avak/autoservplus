courriel.confirmation-commande.retractation.corps=De voorwaarden, de termijn en de wijze van uitoefening van het herroepingsrecht staan in artikel 7 van de bijgevoegde algemene verkoopvoorwaarden, versie {0}. Het modelformulier voor herroeping is eveneens bijgevoegd. U kunt de overeenkomst ook online herroepen op de pagina “{1}” van uw ledenruimte, via de link “{2}”.
courriel.confirmation-commande.retractation.sans-cgv=De voorwaarden, de termijn en de wijze van uitoefening van het herroepingsrecht staan in artikel 7 van de algemene verkoopvoorwaarden die op de website van de garage zijn gepubliceerd. Het modelformulier voor herroeping is bijgevoegd. U kunt de overeenkomst ook online herroepen op de pagina “{0}” van uw ledenruimte, via de link “{1}”.
