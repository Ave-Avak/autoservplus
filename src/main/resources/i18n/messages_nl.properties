courriel.depassement.corps=Tijdens interventie {0} (afspraak {1} op {2}) stelt de garage werken voor die de oorspronkelijke offerte overschrijden.\nOorspronkelijke offerte: {3}\nVoorgesteld totaal: {4}\nWerken die uw akkoord vragen:\n{5}\n\nAntwoord via uw persoonlijke ruimte:\n{6}
