courriel.confirmation-commande.retrait.pieces=De onderdelen worden in de garage afgehaald, op het adres hierboven. Er wordt geen verzending aangeboden. Ze staan uiterlijk dertig dagen na de sluiting van de bestelling voor u klaar, tenzij een andere datum met u is overeengekomen.
courriel.confirmation-commande.retrait.prestations=De aankoop van een dienst reserveert geen tijdslot. De garage neemt contact met u op om de uitvoeringsdatum af te spreken, in zijn werkplaats.
