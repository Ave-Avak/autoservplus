legal.confidentialite.durees.colonne.duree=Termijn
legal.confidentialite.durees.comptable=Reeds opgestelde boekhoudkundige stukken — facturen en creditnota's — worden bij de verwijdering van een account niet gewijzigd of verwijderd: de bewaring ervan steunt op een wettelijke verplichting, die het recht op gegevenswissing voor die stukken uitsluit (artikel 17.3.b van de verordening). De ledenfiche zelf wordt geanonimiseerd.
legal.confidentialite.droits.titre=Uw rechten
legal.confidentialite.droits.colonne.droit=Recht
legal.confidentialite.droits.colonne.article=Grondslag
legal.confidentialite.exercice.titre=Hoe uw rechten uitoefenen
legal.confidentialite.exercice.corps=Vanuit de rubriek « Mijn persoonsgegevens » van uw account kunt u al uw gegevens in een gestructureerd formaat downloaden en de verwijdering van uw account aanvragen. Beide handelingen vereisen dat u uw wachtwoord invoert.
legal.confidentialite.cookies.titre=Cookies
legal.confidentialite.cookies.corps=Het platform plaatst cookies die strikt noodzakelijk zijn voor de werking ervan. Optionele doeleinden zijn onderworpen aan uw toestemming, die per doeleinde wordt verzameld en op elk moment kan worden gewijzigd.
legal.confidentialite.securite.titre=Beveiliging
legal.confidentialite.securite.corps=Wachtwoorden worden bewaard als een onomkeerbare afdruk. Het verkeer met de site wordt onderweg versleuteld. De toegang tot de backoffice is voorbehouden aan het personeel van de garage.

