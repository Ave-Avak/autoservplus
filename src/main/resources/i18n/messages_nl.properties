legal.confidentialite.transferts.titre=Doorgifte buiten de Europese Unie
legal.confidentialite.transferts.completer=Al uw gegevens worden binnen de Europese Unie gehost en verwerkt. Onze technische dienstverleners zijn in de Unie gevestigd: de betaling wordt uitgevoerd door Mollie (Nederland), de verzending van e-mails door Brevo (Frankrijk) en de hosting door Hetzner (Duitsland). Er vindt geen enkele doorgifte van uw persoonsgegevens buiten de Europese Unie plaats.
