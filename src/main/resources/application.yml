spring:
  application:
    name: autoservplus
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autoservplus}
    username: ${DB_USER:autoservplus}
    password: ${DB_PASSWORD:autoservplus}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

autoservplus:
  tva:
    taux-standard: 21.00
  retractation:
    delai-jours: 14
  securite:
    tentatives-max: 5
    duree-verrouillage-minutes: 15

logging:
  level:
    be.autoservplus: INFO
