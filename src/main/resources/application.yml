spring:
  servlet:
    multipart:
      # Plafond du conteneur : il coupe la requete AVANT le controleur, c est la
      # vraie protection contre la saturation. Le controle applicatif de
      # StockageMedia est aligne dessus et sert aux tests hors requete HTTP.
      max-file-size: ${MEDIAS_TAILLE_MAX_HTTP:5MB}
      max-request-size: ${MEDIAS_REQUETE_MAX:25MB}
  application:
    name: autoservplus
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/autoservplus}
    username: ${DB_USER:autoservplus}
    password: ${DB_PASSWORD:autoservplus}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Pas de jdbc.time_zone ici. Le reglage n'aurait d'effet que sur des colonnes
        # temporelles SANS fuseau, et le schema n'en compte aucune : les 51 champs
        # Instant sont tous sur TIMESTAMPTZ, ou le fuseau est porte par la donnee.
        # Son unique effet observable etait donc de fausser les deux seules colonnes
        # TIME du schema — plage_ouverture.heure_debut et heure_fin, lues en LocalTime
        # avec une heure d'ecart. Une heure sans date se rapporte a l'epoch, ou
        # Europe/Brussels vaut UTC+1 : le garage ouvrait a 08:00 en base et le systeme
        # lisait 09:00, en affichage comme au calcul des creneaux reservables.
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

autoservplus:
  tva:
    taux-standard: 21.00

  # Adresse publique du site, employee LA OU une URL absolue est indispensable et ou
  # aucune requete HTTP n'est disponible pour la deduire : aujourd'hui le fichier
  # iCalendar d'un rendez-vous (F38), qui est lu dans l'agenda du membre, hors du
  # site — un chemin relatif n'y designerait rien.
  #
  # Ailleurs le projet emet des liens RELATIFS dans ses courriels et continue de le
  # faire : cette propriete n'est pas une invitation a les absolutiser. Elle vaut
  # aussi pour le telechargement direct plutot que l'URL de la requete, afin que le
  # fichier servi et le fichier joint au courriel soient identiques a l'octet pres —
  # deux variantes du meme UID se remplaceraient l'une l'autre dans l'agenda.
  url-publique: ${URL_PUBLIQUE:http://localhost:8080}

  # Identification legale de l'emetteur des factures (mentions obligatoires :
  # Code TVA art. 53, AR n°1 art. 5). Mono-tenant V1 : un seul garage, donc en
  # configuration plutot qu'en base. Les valeurs livrees sont des valeurs de
  # DEMONSTRATION : chacune doit etre surchargee en production par sa variable
  # d'environnement — une facture portant un faux numero de TVA n'est pas une facture.
  garage:
    raison-sociale: ${GARAGE_RAISON_SOCIALE:AutoServ+ SRL}
    rue: ${GARAGE_RUE:Rue de l'Atelier}
    numero-rue: ${GARAGE_NUMERO_RUE:12}
    code-postal: ${GARAGE_CODE_POSTAL:1000}
    localite: ${GARAGE_LOCALITE:Bruxelles}
    pays: ${GARAGE_PAYS:Belgique}
    numero-bce: ${GARAGE_BCE:0123.456.789}
    numero-tva: ${GARAGE_TVA:BE0123456789}
    iban: ${GARAGE_IBAN:BE68 5390 0754 7034}
    telephone: ${GARAGE_TELEPHONE:+32 2 000 00 00}
    courriel: ${GARAGE_COURRIEL:facturation@autoservplus.be}

  stockage:
    # Racine des fichiers deposes par le back-office (fondation upload).
    # HORS webroot : rien ne sert ce repertoire statiquement, les images passent
    # par un controleur qui verifie ce qu il sert. C est ce qui permet a la CSP de
    # rester img-src 'self' sans relachement. Couvert par .gitignore (uploads/).
    racine: ${MEDIAS_RACINE:./data/uploads}
    # 5 Mo : une photo d atelier prise au telephone tient largement dessous.
    taille-max-octets: ${MEDIAS_TAILLE_MAX:5242880}

  facturation:
    # Racine de l'archive des factures PDF, conservees SEPT ANS (Code TVA art. 60).
    # En production : un volume sauvegarde, distinct du repertoire de deploiement —
    # une archive legale ne peut pas disparaitre avec un redeploiement.
    archive: ${FACTURES_ARCHIVE:./data/factures}
  retractation:
    delai-jours: 14
  securite:
    tentatives-max: 5
    duree-verrouillage-minutes: 15

logging:
  level:
    be.autoservplus: INFO
