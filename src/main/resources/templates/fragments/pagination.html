<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Fragments pagination et période</title></head>
<body>
<!--/* Liens de pagination d'une liste du back-office. Les filtres en cours (période,
     statut, recherche) sont repris du modèle pour que changer de page ne les perde pas. */-->
<nav th:fragment="liens(resultats, chemin)" class="pagination"
     th:if="${resultats.totalPages > 1}" th:attr="aria-label=#{pagination.aria}">
    <a th:if="${resultats.hasPrevious()}"
       th:href="@{${chemin}(du=${periode.duSaisi()},au=${periode.auSaisi()},statut=${statut},recherche=${recherche},page=${resultats.number})}"
       th:text="#{pagination.precedente}" rel="prev">Page précédente</a>
    <span th:text="#{pagination.position(${resultats.number + 1}, ${resultats.totalPages})}">Page 1 sur 3</span>
    <a th:if="${resultats.hasNext()}"
       th:href="@{${chemin}(du=${periode.duSaisi()},au=${periode.auSaisi()},statut=${statut},recherche=${recherche},page=${resultats.number + 2})}"
       th:text="#{pagination.suivante}" rel="next">Page suivante</a>
</nav>

<!--/* Liens de pagination d'une liste sans filtre (fils, notifications). */-->
<nav th:fragment="liensSimples(resultats, chemin)" class="pagination"
     th:if="${resultats.totalPages > 1}" th:attr="aria-label=#{pagination.aria}">
    <a th:if="${resultats.hasPrevious()}" th:href="@{${chemin}(page=${resultats.number})}"
       th:text="#{pagination.precedente}" rel="prev">Page précédente</a>
    <span th:text="#{pagination.position(${resultats.number + 1}, ${resultats.totalPages})}">Page 1 sur 3</span>
    <a th:if="${resultats.hasNext()}" th:href="@{${chemin}(page=${resultats.number + 2})}"
       th:text="#{pagination.suivante}" rel="next">Page suivante</a>
</nav>
<!--/* Liens calculés par PaginationVue, qui reprend tous les filtres de l'adresse. */-->
<nav th:fragment="liensCalcules(pagination)" class="pagination"
     th:if="${pagination.total() > 1}" th:attr="aria-label=#{pagination.aria}">
    <a th:if="${pagination.precedente() != null}" th:href="${pagination.precedente()}"
       th:text="#{pagination.precedente}" rel="prev">Page précédente</a>
    <span th:text="#{pagination.position(${pagination.numero()}, ${pagination.total()})}">Page 1 sur 3</span>
    <a th:if="${pagination.suivante() != null}" th:href="${pagination.suivante()}"
       th:text="#{pagination.suivante}" rel="next">Page suivante</a>
</nav>

<!--/* Filtre commun des listes : période du / au, recherche libre. Les dates sont rendues
     au format ISO, jamais par th:field, qui appliquerait le format belge. */-->
<div th:fragment="periode" class="filtre-periode">
    <div class="champ">
        <label for="du" th:text="#{admin.ventes.filtre.du}">Du</label>
        <input type="date" id="du" name="du" th:value="${periode.duSaisi()}" aria-describedby="aide-periode">
    </div>
    <div class="champ">
        <label for="au" th:text="#{admin.ventes.filtre.au}">Au</label>
        <input type="date" id="au" name="au" th:value="${periode.auSaisi()}" aria-describedby="aide-periode">
    </div>
    <p class="texte-info" id="aide-periode" th:text="#{admin.ventes.filtre.periode.aide}">
        Sans date : les trente derniers jours, ou tout l'historique pour une recherche.</p>
</div>

<!--/* Même période pour une liste sans recherche libre : l'aide ne parle que des trente jours. */-->
<div th:fragment="periodeSansRecherche" class="filtre-periode">
    <div class="champ">
        <label for="du" th:text="#{admin.ventes.filtre.du}">Du</label>
        <input type="date" id="du" name="du" th:value="${periode.duSaisi()}" aria-describedby="aide-periode">
    </div>
    <div class="champ">
        <label for="au" th:text="#{admin.ventes.filtre.au}">Au</label>
        <input type="date" id="au" name="au" th:value="${periode.auSaisi()}" aria-describedby="aide-periode">
    </div>
    <p class="texte-info" id="aide-periode" th:text="#{admin.filtre.periode.aide-sans-recherche}">
        Sans date : les trente derniers jours.</p>
</div>

<!--/* Statut et recherche des listes de prestations et de pièces, mêmes noms dans
     l'adresse. Le modèle porte un FiltreArticlesAdmin sous le nom « filtre ». */-->
<th:block th:fragment="actifEtRecherche">
    <div class="champ">
        <label for="actif" th:text="#{admin.catalogue.colonne.statut}">Statut</label>
        <select id="actif" name="actif">
            <option value="" th:text="#{admin.catalogue.filtre.tous-statuts}">Actifs et inactifs</option>
            <option value="true" th:selected="${filtre.actif() == true}"
                    th:text="#{admin.catalogue.statut.actif}">Actif</option>
            <option value="false" th:selected="${filtre.actif() == false}"
                    th:text="#{admin.catalogue.statut.inactif}">Inactif</option>
        </select>
    </div>
    <div class="champ">
        <label for="recherche" th:text="#{admin.catalogue.filtre.recherche}">Nom, code ou référence</label>
        <input type="search" id="recherche" name="recherche" th:value="${filtre.recherche()}">
    </div>
</th:block>
</body>
</html>
