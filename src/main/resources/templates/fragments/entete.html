<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Fragment en-tête</title></head>
<body>

<!--/*
  En-tête des pages publiques et de l'espace membre, en trois états :
  - visiteur anonyme : catalogue, prise de rendez-vous, contact, connexion et
    inscription ;
  - connexion aboutie : en plus, les liens du compte ;
  - connexion partielle (mot de passe vérifié, étape en attente) : la seule
    déconnexion. Le jeton partiel est authentifié mais ne porte AUCUNE autorité, ce
    qui le distingue sans drapeau de modèle — et vaut aussi sur une page d'erreur, où
    les attributs des advices ne sont pas repeuplés.
  Rôles du back-office : ni Panier (CdC §8.4, l'administrateur ne commande pas), ni
  Messages, qu'il lit dans /admin/messages. Notifications reste : avis déposés et
  messages reçus lui sont notifiés (AvisService, MessagerieService).
  Les compteurs sont fournis par des advices ; absents (page d'erreur), le lien reste
  sans nombre plutôt que d'afficher un zéro faux.

  Menu repliable sous 40em, motif « Disclosure Navigation » (WAI-ARIA APG) : le bouton
  naît caché et menu.js le révèle ; sans script, les liens restent tous affichés.
*/-->
<header class="entete" th:fragment="entete">
    <nav th:attr="aria-label=#{nav.principale}" aria-label="Navigation principale">
        <a class="marque" th:href="@{/}">AutoServ+</a>
        <button type="button" class="bouton-menu" aria-expanded="false" aria-controls="menu-principal" hidden
                th:text="#{nav.menu}">Menu</button>
        <div class="menu-panneau" id="menu-principal">
            <ul class="menu" sec:authorize="!isAuthenticated() or !authentication.authorities.isEmpty()">
                <li><a th:href="@{/services}" th:text="#{nav.prestations}"
                       th:attr="aria-current=${cheminCourant == '/services'} ? 'page' : null">Prestations</a></li>
                <li><a th:href="@{/pieces}" th:text="#{nav.pieces}"
                       th:attr="aria-current=${cheminCourant == '/pieces'} ? 'page' : null">Pièces</a></li>
                <li><a th:href="@{/mes-rendez-vous/nouveau}" th:text="#{nav.rendez-vous}"
                       th:attr="aria-current=${cheminCourant == '/mes-rendez-vous/nouveau'} ? 'page' : null">Prendre rendez-vous</a></li>
                <li><a th:href="@{/contact}" th:text="#{nav.contact}"
                       th:attr="aria-current=${cheminCourant == '/contact'} ? 'page' : null">Contact</a></li>
            </ul>
            <ul class="menu menu-compte" sec:authorize="!isAuthenticated()">
                <li><a th:href="@{/connexion}" th:text="#{nav.connexion}"
                       th:attr="aria-current=${cheminCourant == '/connexion'} ? 'page' : null">Connexion</a></li>
                <li><a class="btn-cta" th:href="@{/inscription}" th:text="#{nav.inscription}">Créer un compte</a></li>
            </ul>
            <ul class="menu menu-compte" sec:authorize="isAuthenticated() and !authentication.authorities.isEmpty()">
                <li sec:authorize="!hasRole('ADMINISTRATEUR')"><a th:href="@{/panier}"
                       th:text="${nombreArticlesPanier != null} ? #{panier.nav(${nombreArticlesPanier})} : #{nav.panier}"
                       th:attr="aria-current=${cheminCourant == '/panier'} ? 'page' : null">Panier</a></li>
                <li sec:authorize="!hasRole('ADMINISTRATEUR')"><a th:href="@{/mes-messages}"
                       th:text="${nombreFilsNonLus != null} ? #{messagerie.nav(${nombreFilsNonLus})} : #{nav.messages}"
                       th:attr="aria-current=${cheminCourant == '/mes-messages'} ? 'page' : null">Messages</a></li>
                <li><a th:href="@{/mes-notifications}"
                       th:text="${nombreNotificationsNonLues != null} ? #{notifications.nav(${nombreNotificationsNonLues})} : #{nav.notifications}"
                       th:attr="aria-current=${cheminCourant == '/mes-notifications'} ? 'page' : null">Notifications</a></li>
                <li sec:authorize="hasRole('ADMINISTRATEUR')"><a th:href="@{/admin}" th:text="#{nav.back-office}">Back-office</a></li>
                <li><a th:href="@{/mon-compte}" th:text="#{nav.mon-compte}"
                       th:attr="aria-current=${cheminCourant == '/mon-compte'} ? 'page' : null">Mon compte</a></li>
                <li>
                    <form th:action="@{/deconnexion}" method="post">
                        <button type="submit" class="lien-bouton" th:text="#{nav.deconnexion}">Se déconnecter</button>
                    </form>
                </li>
            </ul>
            <ul class="menu menu-compte" sec:authorize="isAuthenticated() and authentication.authorities.isEmpty()">
                <li>
                    <form th:action="@{/deconnexion}" method="post">
                        <button type="submit" class="lien-bouton" th:text="#{nav.deconnexion}">Se déconnecter</button>
                    </form>
                </li>
            </ul>
        </div>
    </nav>
    <div th:replace="~{fragments/langue :: selecteur}"></div>
    <script th:src="@{/js/menu.js}" defer></script>
</header>

</body>
</html>
