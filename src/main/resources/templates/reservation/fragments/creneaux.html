<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* Fragment renvoyé par GET /mes-rendez-vous/nouveau/creneaux et inséré dans #creneaux.
     Partagé avec le déplacement au back-office, qui garde l'ancienne feuille : ses classes
     gardent leur nom, la feuille du site les reprend sous #creneaux.
     Le modèle fournit : creneaux (List<CreneauVue>), aucunePrestation (boolean),
     erreurCreneaux (String, facultatif). */-->
<div th:fragment="liste">

    <p class="aide" th:if="${aucunePrestation == true}" th:text="#{rdv.creneaux.aucune-prestation}">
        Cochez au moins une prestation pour voir les heures disponibles.
    </p>

    <p class="message message-erreur" th:if="${erreurCreneaux != null}" th:text="${erreurCreneaux}">Erreur</p>

    <p class="message" th:if="${aucunePrestation != true and creneaux.isEmpty() and erreurCreneaux == null}"
       th:text="#{rdv.creneaux.aucun}">
        Aucune heure disponible ce jour-là pour cette durée. Essayez un autre jour.
    </p>

    <ul class="grille-creneaux" th:unless="${creneaux.isEmpty()}">
        <li th:each="c : ${creneaux}">
            <label class="creneau">
                <input type="radio" name="debut" th:value="${c.valeur()}"
                       th:checked="${formulaire != null and formulaire.debut == c.valeur()}" required>
                <span class="chiffres" th:text="${c.libelle()}">10:00 - 11:00</span>
                <small th:if="${c.postesLibres() > 1}"
                       th:text="#{rdv.creneaux.places(${c.postesLibres()})}">2 places</small>
            </label>
        </li>
    </ul>

</div>
</body>
</html>
