<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{vehicule.liste.titre} + ' | ' + ${garageSite.enseigne()}">Mes véhicules | Bielle Bleue</title>
    <meta name="robots" content="noindex, nofollow">
    <th:block th:replace="~{fragments/site :: ressources}"></th:block>
</head>
<body>

<th:block th:replace="~{fragments/site :: entete}"></th:block>

<main id="contenu" class="container page-membre" tabindex="-1">
    <div class="page-membre__tete">
        <h1 class="page-membre__titre" th:text="#{vehicule.liste.titre}">Mes véhicules</h1>
        <a class="btn btn-action" th:href="@{/mes-vehicules/nouveau}" th:text="#{vehicule.liste.ajouter}">Ajouter un véhicule</a>
    </div>

    <div class="alert alert-success" th:if="${message}" role="status" th:text="${message}">Message</div>

    <p th:if="${vehicules.isEmpty()}" class="page-membre__vide" th:text="#{vehicule.liste.vide}">
        Vous n'avez pas encore enregistré de véhicule.</p>

    <ul class="liste-vehicules" th:unless="${vehicules.isEmpty()}">
        <li class="carte-vehicule" th:each="v : ${vehicules}">
            <h2 class="carte-vehicule__nom" th:text="${v.marque()} + ' ' + ${v.modele()}">Marque Modèle</h2>
            <!--/* La plaque dans les couleurs de la plaque belge, lettres rouges sur fond blanc :
                 c'est à elle que le membre reconnaît sa voiture avant la marque. */-->
            <p class="plaque" th:text="${v.plaque()}">1-ABC-123</p>

            <dl class="carte-vehicule__details">
                <div>
                    <dt th:text="#{vehicule.motorisation}">Motorisation</dt>
                    <dd th:text="#{'vehicule.motorisation.' + ${v.motorisation()}}">Diesel</dd>
                </div>
                <div th:if="${v.annee() != null}">
                    <dt th:text="#{vehicule.annee}">Année</dt>
                    <dd class="chiffres" th:text="${v.annee()}">2018</dd>
                </div>
                <div>
                    <dt th:text="#{vehicule.kilometrage}">Kilométrage</dt>
                    <dd class="chiffres" th:text="${v.kilometrage() == null} ? #{vehicule.kilometrage.non-renseigne}
                                 : #{vehicule.kilometrage.valeur(${v.kilometrage()})}">85 000 km</dd>
                </div>
            </dl>

            <div class="carte-vehicule__actions">
                <a th:href="@{/mes-vehicules/{ref}/historique(ref=${v.reference()})}"
                   th:aria-label="#{vehicule.historique.lien.aria(${v.designation()})}"
                   th:text="#{vehicule.historique.lien}">Historique d'entretien</a>
                <a th:href="@{/mes-vehicules/{ref}/modifier(ref=${v.reference()})}"
                   th:aria-label="#{vehicule.modifier.aria(${v.designation()})}"
                   th:text="#{vehicule.modifier}">Modifier</a>
                <form th:action="@{/mes-vehicules/{ref}/supprimer(ref=${v.reference()})}"
                      method="post"
                      class="formulaire-suppression"
                      th:data-message="#{vehicule.retirer.confirmation(${v.designation()})}">
                    <button type="submit" class="btn btn-link lien-danger"
                            th:aria-label="#{vehicule.retirer.aria(${v.designation()})}"
                            th:text="#{vehicule.retirer}">Retirer</button>
                </form>
            </div>
        </li>
    </ul>

    <p class="page-membre__retour"><a th:href="@{/mon-compte}" th:text="#{erreur.retour-compte}">Retour à mon compte</a></p>
</main>

<script th:src="@{/js/confirmation.js}"></script>
<th:block th:replace="~{fragments/site :: pied}"></th:block>
</body>
</html>
