<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="(${modeAjout} ? #{vehicule.formulaire.titre.ajout} : #{vehicule.formulaire.titre.modification}) + ' | AutoServ+'">Véhicule | AutoServ+</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>

<a class="lien-evitement" href="#contenu" th:text="#{accessibilite.evitement}">Aller au contenu principal</a>

<header th:replace="~{fragments/entete :: entete}"></header>

<main id="contenu">
    <h1 th:text="${modeAjout} ? #{vehicule.formulaire.titre.ajout} : #{vehicule.formulaire.titre.modification}">Ajouter un véhicule</h1>

    <form class="formulaire"
          th:action="${modeAjout}
              ? @{/mes-vehicules/nouveau}
              : @{/mes-vehicules/{ref}/modifier(ref=${reference})}"
          th:object="${formulaire}" method="post" novalidate>

        <div class="champ">
            <label for="plaque" th:text="#{vehicule.formulaire.plaque}">Plaque d'immatriculation</label>
            <input type="text" id="plaque" th:field="*{plaque}"
                   th:readonly="${!modeAjout}"
                   required
                   aria-describedby="aide-plaque">
            <!--/* Une seule aide porte l'identifiant visé par aria-describedby, selon le mode :
                 la plaque se saisit à l'ajout et ne se modifie plus ensuite. */-->
            <p id="aide-plaque" class="texte-info"
               th:text="${modeAjout} ? #{vehicule.formulaire.plaque.aide} : #{vehicule.formulaire.plaque.fixe}">
                Format belge : 1-ABC-123
            </p>
            <p role="alert" class="texte-erreur" th:if="${#fields.hasErrors('plaque')}" th:errors="*{plaque}"></p>
        </div>

        <div class="champ">
            <label for="marque" th:text="#{vehicule.formulaire.marque}">Marque</label>
            <input type="text" id="marque" th:field="*{marque}" required>
            <p role="alert" class="texte-erreur" th:if="${#fields.hasErrors('marque')}" th:errors="*{marque}"></p>
        </div>

        <div class="champ">
            <label for="modele" th:text="#{vehicule.formulaire.modele}">Modèle</label>
            <input type="text" id="modele" th:field="*{modele}" required>
            <p role="alert" class="texte-erreur" th:if="${#fields.hasErrors('modele')}" th:errors="*{modele}"></p>
        </div>

        <div class="champ">
            <label for="motorisation" th:text="#{vehicule.motorisation}">Motorisation</label>
            <select id="motorisation" th:field="*{motorisation}" required>
                <option value="" th:text="#{rdv.formulaire.choisir}">Choisissez</option>
                <option th:each="m : ${motorisations}" th:value="${m}"
                        th:text="#{'vehicule.motorisation.' + ${m}}">Diesel</option>
            </select>
            <p role="alert" class="texte-erreur" th:if="${#fields.hasErrors('motorisation')}" th:errors="*{motorisation}"></p>
        </div>

        <div class="champ">
            <label for="annee" th:text="#{vehicule.formulaire.annee}">Année de mise en circulation</label>
            <input type="number" id="annee" th:field="*{annee}" min="1900" max="2100">
            <p role="alert" class="texte-erreur" th:if="${#fields.hasErrors('annee')}" th:errors="*{annee}"></p>
        </div>

        <div class="champ">
            <label for="kilometrage" th:text="#{vehicule.kilometrage}">Kilométrage</label>
            <input type="number" id="kilometrage" th:field="*{kilometrage}" min="0"
                   aria-describedby="aide-kilometrage">
            <p id="aide-kilometrage" class="texte-info" th:text="#{vehicule.formulaire.kilometrage.aide}">
                Le kilométrage ne peut pas diminuer d'un relevé à l'autre.
            </p>
            <p role="alert" class="texte-erreur" th:if="${#fields.hasErrors('kilometrage')}" th:errors="*{kilometrage}"></p>
        </div>

        <div class="champ">
            <label for="numeroChassis"><span th:text="#{vehicule.formulaire.chassis}">Numéro de châssis</span>
                <span class="champ-facultatif" th:text="#{vehicule.formulaire.facultatif}">(facultatif)</span></label>
            <input type="text" id="numeroChassis" th:field="*{numeroChassis}" maxlength="20">
            <p role="alert" class="texte-erreur" th:if="${#fields.hasErrors('numeroChassis')}" th:errors="*{numeroChassis}"></p>
        </div>

        <button type="submit" class="btn-cta"
                th:text="${modeAjout} ? #{vehicule.formulaire.ajouter} : #{vehicule.formulaire.enregistrer}">
            Enregistrer</button>
    </form>

    <p><a th:href="@{/mes-vehicules}" th:text="#{rdv.formulaire.annuler}">Annuler</a></p>
</main>

<div th:replace="~{fragments/pied :: pied}"></div>
</body>
</html>
