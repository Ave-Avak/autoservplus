<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{rdv.liste.titre} + ' | ' + ${garageSite.enseigne()}">Mes rendez-vous | Bielle Bleue</title>
    <meta name="robots" content="noindex, nofollow">
    <th:block th:replace="~{fragments/site :: ressources}"></th:block>
</head>
<body>

<th:block th:replace="~{fragments/site :: entete}"></th:block>

<main id="contenu" class="container page-membre" tabindex="-1">
    <div class="page-membre__tete">
        <h1 class="page-membre__titre" th:text="#{rdv.liste.titre}">Mes rendez-vous</h1>
        <a class="btn btn-action" th:href="@{/mes-rendez-vous/nouveau}" th:text="#{rdv.liste.prendre}">Prendre rendez-vous</a>
    </div>

    <div class="alert alert-success" th:if="${message}" role="status" th:text="${message}">Message</div>

    <p th:if="${rendezVous.isEmpty()}" class="page-membre__vide" th:text="#{rdv.liste.vide}">
        Vous n'avez pas encore de rendez-vous.</p>

    <!--/* Le jour et l'heure d'abord, puis l'état : c'est ce que le membre vient vérifier
         (NN/g, suivi d'état). L'état se lit en mots, la couleur ne fait que l'appuyer. */-->
    <ul class="liste-rdv" th:unless="${rendezVous.isEmpty()}">
        <li class="carte-rdv" th:each="r : ${rendezVous}">
            <div class="carte-rdv__tete">
                <h2 class="carte-rdv__quand">
                    <span th:text="${#strings.capitalize(#temporals.format(r.jour(), 'EEEE d MMMM yyyy'))}">Mercredi 16 septembre 2026</span>
                    <span class="carte-rdv__heure chiffres" th:text="${r.heureDebut()} + ' - ' + ${r.heureFin()}">10:00 - 11:00</span>
                </h2>
                <span class="badge statut-rdv" th:data-statut="${r.statut()}"
                      th:text="#{'rdv.membre.statut.' + ${r.statut()}}">En attente de confirmation</span>
            </div>
            <p class="carte-rdv__vehicule" th:text="${r.vehicule()}">VW Golf (1-ABC-123)</p>
            <p class="carte-rdv__prestations" th:text="${#strings.listJoin(r.prestations(), ', ')}">Vidange, Plaquettes</p>
            <div class="carte-rdv__actions">
                <a th:href="@{/mes-rendez-vous/{ref}(ref=${r.reference()})}"
                   th:aria-label="#{rdv.liste.detail.aria(${r.numero()})}"
                   th:text="#{rdv.liste.detail}">Détail</a>
                <a th:if="${r.statut()} == 'HONORE'"
                   th:href="@{/mes-interventions/depuis-rdv/{ref}(ref=${r.reference()})}"
                   th:aria-label="#{rdv.liste.suivre.aria(${r.numero()})}"
                   th:text="#{rdv.liste.suivre}">Suivre la réparation</a>
            </div>
        </li>
    </ul>

    <p class="page-membre__retour"><a th:href="@{/mon-compte}" th:text="#{erreur.retour-compte}">Retour à mon compte</a></p>
</main>

<th:block th:replace="~{fragments/site :: pied}"></th:block>
</body>
</html>
