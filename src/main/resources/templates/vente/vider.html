<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{panier.vider.titre} + ' | AutoServ+'">Vider le panier | AutoServ+</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>

<a class="lien-evitement" href="#contenu" th:text="#{accessibilite.evitement}">Aller au contenu principal</a>

<header th:replace="~{fragments/entete :: entete}"></header>

<main id="contenu">
    <p><a th:href="@{/panier}" th:text="#{commande.recap.retour}">Retour au panier</a></p>

    <h1 th:text="#{panier.vider.titre}">Vider le panier</h1>

    <!-- Confirmation explicite : la CSP interdit les scripts en ligne (pas de
         confirm()), et un geste destructif ne se declenche pas d'un seul clic.
         Meme patron que les ecrans admin d'annulation et de refus. -->
    <p th:text="#{panier.vider.question}">Voulez-vous vraiment retirer tous les articles de votre panier ?</p>

    <form th:action="@{/panier/vider}" method="post">
        <p class="actions-page">
            <button type="submit" class="btn-cta" th:text="#{panier.vider.confirmer}">Oui, vider le panier</button>
            <a th:href="@{/panier}" th:text="#{panier.vider.annuler}">Non, revenir au panier</a>
        </p>
    </form>
</main>

<footer class="pied"><p th:text="#{pied.copyright}">&copy; 2026 AutoServ+</p></footer>
<div th:replace="~{fragments/cookies :: bandeau}"></div>
</body>
</html>
