<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{commande.confirmation.titre} + ' | AutoServ+'">Commande enregistrée | AutoServ+</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>

<a class="lien-evitement" href="#contenu" th:text="#{accessibilite.evitement}">Aller au contenu principal</a>

<header th:replace="~{fragments/entete :: entete}"></header>

<main id="contenu">
    <h1 th:text="#{commande.confirmation.titre}">Commande enregistrée</h1>

    <div class="message message-erreur" th:if="${erreur}" role="alert" th:text="${erreur}">Erreur</div>
    <div class="message message-succes" th:if="${succes}" role="status" th:text="${succes}">Succès</div>

    <div class="message message-succes" role="status"
         th:text="#{commande.confirmation.numero(${commande.numero()})}">
        Votre commande CMD-2026-0001 est enregistrée.
    </div>

    <p th:text="#{commande.confirmation.total(${commande.totalTvac()})}">Montant à régler : 80,21 €</p>

    <!-- Sans objet une fois la commande payee : ce texte annonce l'attente. -->
    <p th:if="${commande.enAttenteDePaiement()}" th:text="#{commande.confirmation.paiement}">
        Votre commande sera préparée dès réception du paiement.
    </p>

    <!--
      Le bouton de paiement ne s'affiche QUE tant que la commande en attend un. Cette
      page est desormais le point de chute du retour de paiement : proposer « Procéder
      au paiement » a un membre qui vient de payer serait au mieux deroutant, au pire
      une seconde tentative. Le POST part vers la passerelle — page simulee si aucun
      prestataire n'est configure, Mollie sinon (frontiere MollieGateway).
    -->
    <form th:if="${commande.enAttenteDePaiement()}"
          th:action="@{/commande/{ref}/payer(ref=${commande.reference()})}" method="post">
        <p class="actions-page">
            <button type="submit" class="btn-cta" th:text="#{commande.payer}">Procéder au paiement</button>
            <!-- Une fois payee, la facture se telecharge depuis l'historique : elle
                 doit rester atteignable des annees apres l'achat, pas seulement ici. -->
            <a th:href="@{/commandes}" th:text="#{commandes.nav}">Mes commandes</a>
            <a th:href="@{/pieces}" th:text="#{panier.continuer}">Continuer mes achats</a>
        </p>
    </form>

    <p class="actions-page" th:unless="${commande.enAttenteDePaiement()}">
        <a class="btn-cta" th:href="@{/commandes}" th:text="#{commandes.nav}">Mes commandes</a>
        <a th:href="@{/pieces}" th:text="#{panier.continuer}">Continuer mes achats</a>
    </p>
</main>

<footer class="pied"><p th:text="#{pied.copyright}">&copy; 2026 AutoServ+</p></footer>
<div th:replace="~{fragments/cookies :: bandeau}"></div>
</body>
</html>
