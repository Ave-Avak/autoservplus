<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{commande.confirmation.titre} + ' — AutoServ+'">Commande enregistrée — AutoServ+</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>

<a class="lien-evitement" href="#contenu" th:text="#{accessibilite.evitement}">Aller au contenu principal</a>

<header class="entete">
    <nav th:attr="aria-label=#{nav.principale}" aria-label="Navigation principale">
        <a class="marque" th:href="@{/}">AutoServ+</a>
        <ul class="menu">
            <li><a th:href="@{/services}" th:text="#{nav.prestations}">Prestations</a></li>
            <li><a th:href="@{/pieces}" th:text="#{nav.pieces}">Pièces</a></li>
        </ul>
        <ul class="menu menu-compte">
            <li><a th:href="@{/panier}" th:text="#{panier.nav(${nombreArticlesPanier})}">Panier (0)</a></li>
            <li><a th:href="@{/mon-compte}" th:text="#{nav.mon-compte}">Mon compte</a></li>
            <li>
                <form th:action="@{/deconnexion}" method="post">
                    <button type="submit" class="lien-bouton" th:text="#{nav.deconnexion}">Se déconnecter</button>
                </form>
            </li>
        </ul>
    </nav>
</header>

<main id="contenu">
    <h1 th:text="#{commande.confirmation.titre}">Commande enregistrée</h1>

    <div class="message message-succes" role="status"
         th:text="#{commande.confirmation.numero(${commande.numero()})}">
        Votre commande CMD-2026-0001 est enregistrée.
    </div>

    <p th:text="#{commande.confirmation.total(${commande.totalTvac()})}">Montant à régler : 80,21 €</p>

    <!-- Placeholder assume : le paiement Mollie est le bloc suivant, aucun appel ici. -->
    <p th:text="#{commande.confirmation.paiement}">
        Le paiement en ligne sera proposé à la prochaine étape.
    </p>

    <p class="actions-page">
        <a class="btn-cta" th:href="@{/pieces}" th:text="#{panier.continuer}">Continuer mes achats</a>
        <a th:href="@{/mon-compte}" th:text="#{nav.mon-compte}">Mon compte</a>
    </p>
</main>

<footer class="pied"><p th:text="#{pied.copyright}">&copy; 2026 AutoServ+</p></footer>
</body>
</html>
