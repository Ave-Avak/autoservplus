<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{suppression.confirmee.titre} + ' | ' + ${garageSite.enseigne()}">Compte supprimé | Bielle Bleue</title>
    <meta name="robots" content="noindex, nofollow">
    <th:block th:replace="~{fragments/site :: ressources}"></th:block>
</head>
<body>

<!--/* Navigation publique : la session vient d'être invalidée, il n'y a plus de
     « Mon compte » ni de bouton de déconnexion à proposer. */-->
<th:block th:replace="~{fragments/site :: entete}"></th:block>

<main id="contenu" class="container page-formulaire" tabindex="-1">
    <h1 class="page-formulaire__titre" th:text="#{suppression.confirmee.titre}">Votre compte a été supprimé</h1>

    <div class="alert alert-success" role="status" th:text="#{suppression.confirmee.message}">
        Vos données personnelles ont été effacées et votre accès révoqué.
    </div>

    <p th:text="#{suppression.confirmee.conservation}">
        Vos factures restent conservées sept ans, comme la loi l'impose.
    </p>
    <p th:text="#{suppression.confirmee.courriel}">
        Une confirmation vous a été envoyée par courriel.
    </p>
    <!--/* Le jeton d'anonymisation libère l'adresse réelle : la réinscription est
         possible, et le dire évite une question au garage. */-->
    <p th:text="#{suppression.confirmee.reinscription}">
        Vous pouvez créer un nouveau compte avec la même adresse.
    </p>

    <p class="actions-formulaire">
        <a class="btn btn-outline-primary" th:href="@{/}" th:text="#{suppression.confirmee.accueil}">Retour à l'accueil</a>
    </p>
</main>

<th:block th:replace="~{fragments/site :: pied}"></th:block>
</body>
</html>
