<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{connexion.etape.second-facteur.titre} + ' | ' + ${garageSite.enseigne()}">Code de vérification | Bielle Bleue</title>
    <meta name="robots" content="noindex, nofollow">
    <th:block th:replace="~{fragments/site :: ressources}"></th:block>
</head>
<body>

<!--/* Connexion partielle : l'en-tête du site n'y montre ni la navigation ni l'espace du
     compte, qui ne seraient pas atteignables. Seule la déconnexion reste proposée. */-->
<th:block th:replace="~{fragments/site :: entete}"></th:block>

<main id="contenu" class="container page-formulaire" tabindex="-1">
    <h1 class="page-formulaire__titre" th:text="#{connexion.etape.second-facteur.titre}">Code de vérification</h1>

    <div class="alert alert-danger" th:if="${erreur}" role="alert" th:text="${erreur}">Code incorrect.</div>

    <p class="page-formulaire__intro" th:text="#{connexion.etape.second-facteur.aide}">
        Saisissez le code à six chiffres affiché par votre application d'authentification.</p>

    <form th:action="@{/connexion/etape/second-facteur}" method="post">
        <div class="champ-site">
            <label class="form-label" for="code" th:text="#{connexion.etape.second-facteur.code}">Code de vérification</label>
            <!--/* one-time-code : le navigateur et le téléphone proposent le code reçu.
                 Avec numeric, le mobile affiche un clavier à chiffres. Sept caractères pour l'espace
                 que certaines applications affichent au milieu du code. */-->
            <input class="form-control champ-code chiffres" type="text" id="code" name="code" autocomplete="one-time-code"
                   inputmode="numeric" maxlength="7" required autofocus>
        </div>
        <div class="actions-formulaire">
            <button type="submit" class="btn btn-action btn-lg" th:text="#{connexion.etape.second-facteur.valider}">Valider</button>
        </div>
    </form>

    <!--/* Champ distinct pour les codes de secours : ils comptent des lettres, qu'un
         clavier numérique de téléphone n'offre pas. <details> natif, sans JavaScript,
         comme le bandeau des cookies. Même route, même service : limitation et journal
         sont ceux du code TOTP. Rouvert d'office après un refus venu de ce champ. */-->
    <details th:open="${secoursOuvert}" class="details-formulaire">
        <summary th:text="#{connexion.etape.second-facteur.secours.lien}">Utiliser un code de secours</summary>
        <p th:text="#{connexion.etape.second-facteur.secours}">
            Sans votre téléphone, saisissez l'un de vos codes de secours.</p>
        <form th:action="@{/connexion/etape/second-facteur}" method="post">
            <input type="hidden" name="mode" value="secours">
            <div class="champ-site">
                <label class="form-label" for="code-secours" th:text="#{connexion.etape.second-facteur.secours.champ}">Code de secours</label>
                <p id="aide-secours" class="form-text mt-0 mb-2" th:text="#{connexion.etape.second-facteur.secours.format}">
                    Huit caractères, avec ou sans le tiret.</p>
                <!--/* autocomplete off : un code de secours ne sert qu'une fois, et ni un
                     code reçu par SMS (one-time-code) ni un mot de passe enregistré n'a
                     à y être proposé. */-->
                <input class="form-control champ-code" type="text" id="code-secours" name="code" autocomplete="off"
                       autocapitalize="characters" spellcheck="false" maxlength="9" required
                       aria-describedby="aide-secours">
            </div>
            <div class="actions-formulaire">
                <button type="submit" class="btn btn-outline-primary" th:text="#{connexion.etape.second-facteur.valider}">Valider</button>
            </div>
        </form>
    </details>

</main>

<th:block th:replace="~{fragments/site :: pied}"></th:block>
</body>
</html>
