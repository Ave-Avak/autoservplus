<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{changement-email.resultat.titre} + ' — AutoServ+'">Changement d'adresse — AutoServ+</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>

<a class="lien-evitement" href="#contenu" th:text="#{accessibilite.evitement}">Aller au contenu principal</a>

<!-- En-tête PUBLIQUE : à cet instant la session vient d'être coupée, et le lien peut
     avoir été ouvert dans un navigateur jamais connecté. Un menu « Mon compte » y
     mènerait vers un formulaire de connexion sans explication. -->
<header class="entete">
    <nav th:attr="aria-label=#{nav.principale}" aria-label="Navigation principale">
        <a class="marque" th:href="@{/}">AutoServ+</a>
    </nav>
    <div th:replace="~{fragments/langue :: selecteur}"></div>
</header>

<main id="contenu">

    <div th:if="${echec == null}">
        <h1 th:text="#{changement-email.resultat.titre}">Adresse confirmée</h1>
        <div class="message message-succes" role="status"
             th:text="#{changement-email.resultat.succes}">
            Votre nouvelle adresse est active. Reconnectez-vous avec celle-ci.
        </div>
        <p class="actions-page">
            <a class="btn-cta" th:href="@{/connexion}" th:text="#{nav.connexion}">Se connecter</a>
        </p>
    </div>

    <div th:if="${echec != null}">
        <h1 th:text="#{changement-email.resultat.echec.titre}">Lien inutilisable</h1>
        <div class="message message-erreur" role="alert" th:text="${echec}">Motif du refus.</div>
        <!-- Aucun lien direct vers le formulaire : il est authentifié, et le membre
             arrive ici depuis sa boîte, souvent déconnecté. On le renvoie donc vers la
             connexion, seul chemin qui aboutisse. -->
        <p class="actions-page">
            <a class="btn-cta" th:href="@{/connexion}" th:text="#{nav.connexion}">Se connecter</a>
        </p>
    </div>

</main>

<footer class="pied"><p th:text="#{pied.copyright}">&copy; 2026 AutoServ+</p></footer>
<div th:replace="~{fragments/cookies :: bandeau}"></div>
</body>
</html>
