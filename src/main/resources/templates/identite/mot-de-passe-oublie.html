<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{mot-de-passe.oublie.titre} + ' | AutoServ+'">Mot de passe oublié | AutoServ+</title>
    <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>
<a class="lien-evitement" href="#contenu" th:text="#{accessibilite.evitement}">Aller au contenu principal</a>
<header th:replace="~{fragments/entete :: entete}"></header>
<main id="contenu">
    <h1 th:text="#{mot-de-passe.oublie.titre}">Mot de passe oublié</h1>
    <p th:text="#{mot-de-passe.oublie.intro}">Indiquez l'adresse associée à votre compte. Nous vous enverrons la marche à suivre.</p>

    <form class="formulaire" th:action="@{/mot-de-passe/oublie}" method="post">
        <div class="champ">
            <label for="email" th:text="#{connexion.email}">Adresse de courriel</label>
            <input type="email" id="email" name="email" autocomplete="email" required autofocus>
        </div>
        <button type="submit" class="btn-cta" th:text="#{mot-de-passe.oublie.envoyer}">Envoyer</button>
        <div th:replace="~{fragments/antibot :: pieges(${horodatageAntiBot})}"></div>
        <div th:replace="~{fragments/antibot :: turnstile(${cleTurnstile})}"></div>
    </form>

    <p><a th:href="@{/connexion}" th:text="#{mot-de-passe.oublie.retour}">Retour à la connexion</a></p>
</main>
<div th:replace="~{fragments/pied :: pied}"></div>
</body>
</html>
