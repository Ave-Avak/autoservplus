<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{mot-de-passe-a-definir.titre} + ' — AutoServ+'">Choisissez votre mot de passe — AutoServ+</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>

<a class="lien-evitement" href="#contenu" th:text="#{accessibilite.evitement}">Aller au contenu principal</a>

<header class="entete">
    <nav th:attr="aria-label=#{nav.principale}" aria-label="Navigation principale">
        <a class="marque" th:href="@{/}">AutoServ+</a>
        <!-- Deux usages, un écran : changement imposé pendant une connexion (seule la
             déconnexion est atteignable), ou définition depuis un lien reçu par
             courriel (personne n'est connecté). -->
        <ul class="menu menu-compte" th:if="${enConnexion}">
            <li>
                <form th:action="@{/deconnexion}" method="post">
                    <button type="submit" class="lien-bouton" th:text="#{nav.deconnexion}">Se déconnecter</button>
                </form>
            </li>
        </ul>
    </nav>
    <div th:replace="~{fragments/langue :: selecteur}"></div>
</header>

<main id="contenu">
    <h1 th:text="#{mot-de-passe-a-definir.titre}">Choisissez votre mot de passe</h1>

    <p th:text="${enConnexion} ? #{mot-de-passe-a-definir.aide.impose} : #{mot-de-passe-a-definir.aide.definition}">
        Le mot de passe actuel de ce compte vous a été remis : choisissez le vôtre avant de continuer.</p>

    <form class="formulaire" th:action="@{${action}}" th:object="${formulaire}" method="post" novalidate>
        <input type="hidden" name="jeton" th:if="${jeton != null}" th:value="${jeton}">

        <div class="champ">
            <label for="motDePasse" th:text="#{mot-de-passe-a-definir.nouveau}">Nouveau mot de passe</label>
            <!-- Jamais th:field : il renverrait le mot de passe dans la page au retour
                 d'une erreur. -->
            <input type="password" id="motDePasse" name="motDePasse"
                   autocomplete="new-password" required aria-describedby="aide-mdp" autofocus>
            <p id="aide-mdp" class="texte-info" th:text="#{validation.motDePasse.aide}">
                Au moins 15 caractères. Une phrase que vous seul connaissez convient, espaces compris.</p>
            <p role="alert" class="texte-erreur" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}"></p>
        </div>

        <div class="champ">
            <label for="confirmation" th:text="#{mot-de-passe-a-definir.confirmation}">Confirmez le mot de passe</label>
            <input type="password" id="confirmation" name="confirmation"
                   autocomplete="new-password" required>
            <p role="alert" class="texte-erreur" th:if="${#fields.hasErrors('confirmation')}" th:errors="*{confirmation}"></p>
        </div>

        <button type="submit" class="btn-cta" th:text="#{mot-de-passe-a-definir.enregistrer}">Enregistrer</button>
    </form>
</main>

<footer class="pied"><p th:text="#{pied.copyright}">&copy; 2026 AutoServ+</p></footer>
<div th:replace="~{fragments/cookies :: bandeau}"></div>
</body>
</html>
