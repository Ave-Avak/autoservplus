<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vérifiez votre courriel — AutoServ+</title>
    <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>
<header class="entete">
    <nav><a class="marque" th:href="@{/}">AutoServ+</a></nav>
</header>
<main id="contenu">
    <h1>Votre compte est presque prêt</h1>
    <div class="message message-succes" role="status">
        <p>Un courriel de vérification a été envoyé à
            <strong th:text="${adresse}">adresse@exemple.be</strong>.</p>
        <p>Cliquez sur le lien qu'il contient pour activer votre compte.
            Le lien reste valable vingt-quatre heures.</p>
    </div>
    <p><a th:href="@{/}">Retour à l'accueil</a></p>
</main>
<footer class="pied"><p>&copy; 2026 AutoServ+</p></footer>
</body>
</html>
