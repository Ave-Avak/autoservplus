<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vérification — AutoServ+</title>
    <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>
<header class="entete">
    <nav><a class="marque" th:href="@{/}">AutoServ+</a></nav>
    <div th:replace="~{fragments/langue :: selecteur}"></div>
</header>
<main id="contenu">
    <div th:if="${succes}">
        <h1>Votre adresse est vérifiée</h1>
        <div class="message message-succes" role="status">
            <p>Votre compte est actif. Vous pouvez maintenant vous connecter.</p>
        </div>
        <a class="btn-cta" th:href="@{/connexion}">Se connecter</a>
    </div>
    <div th:unless="${succes}">
        <h1>Vérification impossible</h1>
        <div class="message message-erreur" role="alert">
            <p th:text="${motif}">Le lien est invalide ou a expiré.</p>
        </div>
        <p><a th:href="@{/}">Retour à l'accueil</a></p>
    </div>
</main>
<footer class="pied"><p>&copy; 2026 AutoServ+</p></footer>
<div th:replace="~{fragments/cookies :: bandeau}"></div>
</body>
</html>
