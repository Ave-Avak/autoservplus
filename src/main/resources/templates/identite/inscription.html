<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Créer un compte — AutoServ+</title>
  <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>

<a class="lien-evitement" href="#contenu">Aller au contenu principal</a>

<header class="entete">
  <nav aria-label="Navigation principale">
    <a class="marque" th:href="@{/}">AutoServ+</a>
    <ul class="menu menu-compte">
      <li><a th:href="@{/connexion}">Connexion</a></li>
    </ul>
  </nav>
</header>

<main id="contenu">
  <h1>Créer un compte</h1>

  <form class="formulaire" th:action="@{/inscription}" th:object="${formulaire}" method="post" novalidate>

    <div class="message message-erreur" th:if="${#fields.hasGlobalErrors()}" role="alert">
      <p th:each="err : ${#fields.globalErrors()}" th:text="${err}">Erreur</p>
    </div>

    <div class="champ">
      <label for="prenom">Prénom</label>
      <input type="text" id="prenom" th:field="*{prenom}" autocomplete="given-name" required>
      <p class="texte-erreur" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></p>
    </div>

    <div class="champ">
      <label for="nom">Nom</label>
      <input type="text" id="nom" th:field="*{nom}" autocomplete="family-name" required>
      <p class="texte-erreur" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></p>
    </div>

    <div class="champ">
      <label for="email">Adresse de courriel</label>
      <input type="email" id="email" th:field="*{email}" autocomplete="email" required>
      <p class="texte-erreur" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
    </div>

    <div class="champ">
      <label for="motDePasse">Mot de passe</label>
      <input type="password" id="motDePasse" th:field="*{motDePasse}"
             autocomplete="new-password" minlength="12" required
             aria-describedby="aide-mot-de-passe">
      <p id="aide-mot-de-passe" class="texte-info">Douze caractères minimum.</p>
      <p class="texte-erreur" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}"></p>
    </div>

    <div class="champ">
      <label for="confirmationMotDePasse">Confirmez le mot de passe</label>
      <input type="password" id="confirmationMotDePasse" th:field="*{confirmationMotDePasse}"
             autocomplete="new-password" required>
      <p class="texte-erreur" th:if="${#fields.hasErrors('confirmationMotDePasse')}"
         th:errors="*{confirmationMotDePasse}"></p>
    </div>

    <div class="champ">
      <label for="langue">Langue</label>
      <select id="langue" th:field="*{langue}">
        <option value="fr">Français</option>
        <option value="nl">Nederlands</option>
        <option value="en">English</option>
      </select>
    </div>

    <button type="submit" class="btn-cta">Créer mon compte</button>
  </form>
</main>

<footer class="pied">
  <p>&copy; 2026 AutoServ+</p>
</footer>

</body>
</html>
