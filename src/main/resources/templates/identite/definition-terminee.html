<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{definition.terminee.titre} + ' — AutoServ+'">Mot de passe enregistré — AutoServ+</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>

<a class="lien-evitement" href="#contenu" th:text="#{accessibilite.evitement}">Aller au contenu principal</a>

<header class="entete">
    <nav th:attr="aria-label=#{nav.principale}" aria-label="Navigation principale">
        <a class="marque" th:href="@{/}">AutoServ+</a>
    </nav>
    <div th:replace="~{fragments/langue :: selecteur}"></div>
</header>

<main id="contenu">
    <h1 th:text="#{definition.terminee.titre}">Mot de passe enregistré</h1>
    <p th:text="#{definition.terminee.aide}">
        Connectez-vous : la vérification en deux étapes vous sera ensuite demandée.</p>
    <p class="actions-page">
        <a class="btn-cta" th:href="@{/connexion}" th:text="#{definition.terminee.connexion}">Se connecter</a>
    </p>
</main>

<footer class="pied"><p th:text="#{pied.copyright}">&copy; 2026 AutoServ+</p></footer>
<div th:replace="~{fragments/cookies :: bandeau}"></div>
</body>
</html>
