<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre} + ' — AutoServ+'">AutoServ+</title>
    <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>

<a class="lien-evitement" th:href="@{#contenu}" th:text="#{accessibilite.evitement}">
    Aller au contenu principal
</a>

<header class="entete">
    <nav aria-label="Navigation principale">
        <a class="marque" th:href="@{/}">AutoServ+</a>
        <ul class="menu">
            <li><a th:href="@{/services}" th:text="#{nav.services}">Prestations</a></li>
            <li><a th:href="@{/pieces}" th:text="#{nav.pieces}">Pièces</a></li>
        </ul>
        <ul class="menu menu-compte">
            <li sec:authorize="!isAuthenticated()" xmlns:sec="http://www.w3.org/1999/xhtml">
                <a th:href="@{/connexion}" th:text="#{nav.connexion}">Connexion</a>
            </li>
            <li sec:authorize="!isAuthenticated()" xmlns:sec="http://www.w3.org/1999/xhtml">
                <a class="btn-cta" th:href="@{/inscription}" th:text="#{nav.inscription}">Créer un compte</a>
            </li>
            <li sec:authorize="isAuthenticated()" xmlns:sec="http://www.w3.org/1999/xhtml">
                <a th:href="@{/mon-compte}" th:text="#{nav.compte}">Mon compte</a>
            </li>
            <li sec:authorize="isAuthenticated()" xmlns:sec="http://www.w3.org/1999/xhtml">
                <form th:action="@{/deconnexion}" method="post">
                    <button type="submit" class="lien-bouton" th:text="#{nav.deconnexion}">Se déconnecter</button>
                </form>
            </li>
        </ul>
        <ul class="menu menu-langue" aria-label="Choix de la langue">
            <li><a th:href="@{'' (lang='fr')}" hreflang="fr">FR</a></li>
            <li><a th:href="@{'' (lang='nl')}" hreflang="nl">NL</a></li>
            <li><a th:href="@{'' (lang='en')}" hreflang="en">EN</a></li>
        </ul>
    </nav>
</header>

<main id="contenu">
    <div th:replace="${contenu}">Contenu de la page</div>
</main>

<footer class="pied">
    <ul>
        <li><a th:href="@{/cgv}">CGV</a></li>
        <li><a th:href="@{/mentions-legales}">Mentions légales</a></li>
        <li><a th:href="@{/confidentialite}">Confidentialité</a></li>
        <li><a th:href="@{/cookies}">Cookies</a></li>
    </ul>
    <p>&copy; 2026 AutoServ+</p>
</footer>

</body>
</html>
