<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{retractation.introuvable.titre} + ' | AutoServ+'">Commande introuvable | AutoServ+</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>

<a class="lien-evitement" href="#contenu" th:text="#{accessibilite.evitement}">Aller au contenu principal</a>

<header th:replace="~{fragments/entete :: entete}"></header>

<main id="contenu">
    <h1 th:text="#{retractation.introuvable.titre}">Commande introuvable</h1>

    <!-- Meme page pour une reference inconnue et pour la commande d'autrui : le
         message ne doit rien confirmer a qui essaie des identifiants. -->
    <div class="message message-erreur" role="alert"
         th:text="#{retractation.introuvable.message}">
        Cette commande n'existe pas ou ne vous appartient pas.
    </div>

    <p class="actions-page">
        <a th:href="@{/commandes}" th:text="#{retractation.retour}">Retour à mes commandes</a>
    </p>
</main>

<footer class="pied"><p th:text="#{pied.copyright}">&copy; 2026 AutoServ+</p></footer>
<div th:replace="~{fragments/cookies :: bandeau}"></div>
</body>
</html>
