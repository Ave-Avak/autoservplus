<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mon compte — AutoServ+</title>
    <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>
<header class="entete">
    <nav aria-label="Navigation principale">
        <a class="marque" th:href="@{/}">AutoServ+</a>
        <ul class="menu menu-compte">
            <li>
                <form th:action="@{/deconnexion}" method="post">
                    <button type="submit" class="lien-bouton">Se déconnecter</button>
                </form>
            </li>
        </ul>
    </nav>
</header>
<main id="contenu">
    <h1>Mon compte</h1>
    <p>Connecté en tant que <strong th:text="${email}">adresse@exemple.be</strong>.</p>

    <nav class="grille-articles" aria-label="Sections de mon compte">
        <a class="carte carte-lien" th:href="@{/mes-vehicules}">
            <h2>Mes véhicules</h2>
            <p>Gérez votre parc et suivez le kilométrage de chaque véhicule.</p>
        </a>
    </nav>
</main>
<footer class="pied"><p>&copy; 2026 AutoServ+</p></footer>
</body>
</html>
