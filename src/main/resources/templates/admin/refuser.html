<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{admin.rdv.refuser.titre} + ' | AutoServ+'">Refuser un rendez-vous | AutoServ+</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>

<a class="lien-evitement" href="#contenu" th:text="#{accessibilite.evitement}">Aller au contenu principal</a>

<header th:replace="~{fragments/back-office :: entete}"></header>

<main id="contenu">
    <p><a th:href="@{/admin/rendez-vous/{ref}(ref=${rdv.reference()})}" th:text="#{admin.rdv.motif.retour}">Retour au rendez-vous</a></p>

    <h1 th:text="#{admin.rdv.refuser.titre}">Refuser un rendez-vous</h1>

    <dl class="vehicule-details">
        <div>
            <dt th:text="#{admin.rdv.colonne.numero}">Numéro</dt>
            <dd th:text="${rdv.numero()}">RDV-2026-0001</dd>
        </div>
        <div>
            <dt th:text="#{admin.rdv.colonne.membre}">Membre</dt>
            <dd>
                <span th:text="${rdv.membreNom()}">Marie Dupont</span>
                (<a th:href="'mailto:' + ${rdv.membreEmail()}" th:text="${rdv.membreEmail()}">marie@exemple.be</a>)
            </dd>
        </div>
        <div>
            <dt th:text="#{admin.rdv.colonne.date}">Date</dt>
            <dd th:text="${#strings.capitalize(#temporals.format(rdv.debut(), 'EEEE d MMMM yyyy'))}">Dimanche 13 septembre 2026</dd>
        </div>
        <div>
            <dt th:text="#{admin.rdv.colonne.heure}">Heure</dt>
            <dd th:text="${rdv.heureDebut()} + ' - ' + ${rdv.heureFin()}">10:00 - 11:00</dd>
        </div>
        <div>
            <dt th:text="#{admin.rdv.colonne.vehicule}">Véhicule</dt>
            <dd th:text="${rdv.vehicule()}">VW Golf (1-ABC-123)</dd>
        </div>
    </dl>

    <form class="formulaire"
          th:action="@{/admin/rendez-vous/{ref}/refuser(ref=${rdv.reference()})}"
          th:object="${formulaire}" method="post" novalidate>

        <div class="champ">
            <label for="motif" th:text="#{admin.rdv.refuser.motif}">Motif du refus</label>
            <textarea id="motif" th:field="*{motif}" rows="4" maxlength="500" required
                      aria-describedby="aide-motif"></textarea>
            <p id="aide-motif" class="texte-info" th:text="#{admin.rdv.motif.aide}">
                Le motif est communiqué au membre par courriel.
            </p>
            <p role="alert" class="texte-erreur" th:if="${#fields.hasErrors('motif')}" th:errors="*{motif}"></p>
        </div>

        <p class="actions-page">
            <button type="submit" class="btn-cta" th:text="#{admin.rdv.refuser.bouton}">Refuser</button>
            <a th:href="@{/admin/rendez-vous}" th:text="#{admin.rdv.motif.retour-liste}">Retour à la liste</a>
        </p>
    </form>
</main>

<div th:replace="~{fragments/pied :: pied}"></div>
</body>
</html>
