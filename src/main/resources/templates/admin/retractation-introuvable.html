<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{admin.retractations.introuvable} + ' | AutoServ+'">Demande introuvable | AutoServ+</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>

<a class="lien-evitement" href="#contenu" th:text="#{accessibilite.evitement}">Aller au contenu principal</a>

<header th:replace="~{fragments/back-office :: entete}"></header>

<main id="contenu">
    <h1 th:text="#{admin.retractations.introuvable}">Demande introuvable</h1>

    <div class="message message-erreur" th:if="${erreur}" role="alert" th:text="${erreur}">Erreur</div>

    <p class="actions-page">
        <a th:href="@{/admin/retractations}" th:text="#{admin.retractations.retour}">Retour à la liste</a>
    </p>
</main>

<footer class="pied"><p th:text="#{pied.copyright}">&copy; 2026 AutoServ+</p></footer>
<div th:replace="~{fragments/cookies :: bandeau}"></div>
</body>
</html>
