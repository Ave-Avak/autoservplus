<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{admin.administrateurs.nouveau.titre} + ' — AutoServ+'">Nouvel administrateur — AutoServ+</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>

<a class="lien-evitement" href="#contenu" th:text="#{accessibilite.evitement}">Aller au contenu principal</a>

<header class="entete">
    <nav th:attr="aria-label=#{nav.principale}" aria-label="Navigation principale">
        <a class="marque" th:href="@{/}">AutoServ+</a>
        <ul class="menu menu-compte">
            <li><a th:href="@{/mon-compte}" th:text="#{nav.mon-compte}">Mon compte</a></li>
            <li>
                <form th:action="@{/deconnexion}" method="post">
                    <button type="submit" class="lien-bouton" th:text="#{nav.deconnexion}">Se déconnecter</button>
                </form>
            </li>
        </ul>
    </nav>
    <div th:replace="~{fragments/langue :: selecteur}"></div>
</header>

<main id="contenu">
    <h1 th:text="#{admin.administrateurs.nouveau.titre}">Nouvel administrateur</h1>

    <!--/* Aucun champ de mot de passe : le titulaire choisira le sien depuis le lien
         qu'il recevra. Un mot de passe saisi ici serait connu de deux personnes. */-->
    <p class="texte-info" th:text="#{admin.administrateurs.nouveau.aide}">
        Un lien valable 24 heures sera envoyé à cette adresse pour que la personne choisisse son mot de passe.</p>

    <form class="formulaire" th:action="@{/admin/comptes/administrateurs/nouveau}"
          th:object="${formulaire}" method="post" novalidate>
        <div class="champ">
            <label for="email" th:text="#{admin.administrateurs.nouveau.email}">Adresse de courriel</label>
            <input type="email" id="email" th:field="*{email}" autocomplete="off" required>
            <p role="alert" class="texte-erreur" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>
        <div class="champ">
            <label for="prenom" th:text="#{admin.administrateurs.nouveau.prenom}">Prénom</label>
            <input type="text" id="prenom" th:field="*{prenom}" autocomplete="off" required>
            <p role="alert" class="texte-erreur" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></p>
        </div>
        <div class="champ">
            <label for="nom" th:text="#{admin.administrateurs.nouveau.nom}">Nom</label>
            <input type="text" id="nom" th:field="*{nom}" autocomplete="off" required>
            <p role="alert" class="texte-erreur" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></p>
        </div>
        <div class="champ">
            <label for="fonction" th:text="#{admin.administrateurs.nouveau.fonction}">Fonction (facultatif)</label>
            <input type="text" id="fonction" th:field="*{fonction}" autocomplete="off">
            <p role="alert" class="texte-erreur" th:if="${#fields.hasErrors('fonction')}" th:errors="*{fonction}"></p>
        </div>
        <p class="actions-page">
            <button type="submit" class="btn-cta" th:text="#{admin.administrateurs.nouveau.creer}">Créer et envoyer le lien</button>
            <a th:href="@{/admin/comptes/administrateurs}" th:text="#{admin.administrateurs.nouveau.retour}">Retour aux comptes du back-office</a>
        </p>
    </form>
</main>

<footer class="pied"><p th:text="#{pied.copyright}">&copy; 2026 AutoServ+</p></footer>
<div th:replace="~{fragments/cookies :: bandeau}"></div>
</body>
</html>
