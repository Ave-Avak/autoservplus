<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{messagerie.nouveau.titre} + ' — AutoServ+'">Poser une question — AutoServ+</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" th:href="@{/css/autoservplus.css}">
</head>
<body>
<a class="lien-evitement" href="#contenu" th:text="#{accessibilite.evitement}">Aller au contenu principal</a>
<header class="entete">
    <nav th:attr="aria-label=#{nav.principale}" aria-label="Navigation principale">
        <a class="marque" th:href="@{/}">AutoServ+</a>
        <ul class="menu menu-compte">
            <li><a th:href="@{/mes-messages}" th:text="#{messagerie.titre}">Mes messages</a></li>
            <li><a th:href="@{/mon-compte}" th:text="#{nav.mon-compte}">Mon compte</a></li>
            <li><form th:action="@{/deconnexion}" method="post">
                <button type="submit" class="lien-bouton" th:text="#{nav.deconnexion}">Se déconnecter</button>
            </form></li>
        </ul>
    </nav>
    <div th:replace="~{fragments/langue :: selecteur}"></div>
</header>
<main id="contenu">
    <h1 th:text="#{messagerie.nouveau.titre}">Poser une question</h1>

    <form th:action="@{/mes-messages/nouveau}" th:object="${formulaire}" method="post">
        <p>
            <label for="sujet" th:text="#{messagerie.sujet}">Sujet</label>
            <input type="text" id="sujet" th:field="*{sujet}" maxlength="150" required>
        </p>
        <p class="erreur" th:if="${#fields.hasErrors('sujet')}" th:errors="*{sujet}">Sujet obligatoire.</p>

        <p>
            <label for="corps" th:text="#{messagerie.reponse}">Votre message</label>
            <textarea id="corps" th:field="*{corps}" rows="6" maxlength="4000" required></textarea>
        </p>
        <p class="erreur" th:if="${#fields.hasErrors('corps')}" th:errors="*{corps}">Message obligatoire.</p>

        <!-- Le socle ne prévoit qu'un rattachement à une intervention. Pour une
             question sur une commande, le membre ouvre un fil libre et cite la
             référence dans son message. -->
        <p class="carte-meta" th:text="#{messagerie.nouveau.aide}">
            Pour une question sur une commande, citez son numéro dans votre message.
        </p>

        <p><button type="submit" class="btn-cta" th:text="#{messagerie.envoyer}">Envoyer</button></p>
    </form>

    <p><a th:href="@{/mes-messages}" th:text="#{messagerie.retour}">Retour à mes messages</a></p>
</main>
<footer class="pied"><p th:text="#{pied.copyright}">&copy; 2026 AutoServ+</p></footer>
<div th:replace="~{fragments/cookies :: bandeau}"></div>
</body>
</html>
