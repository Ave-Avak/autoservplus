# Configuration propre aux tests, chargee EN PLUS de application.yml : classpath:/config/
# est lu par Spring Boot apres classpath:/ et ne le masque pas, contrairement a un second
# application.yml qui le remplacerait entierement.
#
# Cle maitre TOTP FIXE des tests. MfaConfig refuse de demarrer sans cle sous tout profil,
# et le code de production n en contient aucune : c est ici, et seulement ici, qu une cle
# connue d avance a sa place. Elle ne protege rien : les secrets des tests sont jetables.
autoservplus.mfa.cle-maitre=Y2xlLWRlLXRlc3QtYXV0b3NlcnZwbHVzLXRvdHAhISE=
#
# Plafond d echecs de connexion par IP hors d atteinte. MockMvc presente toutes les
# requetes depuis 127.0.0.1, et les cas d une meme classe partagent son contexte, donc
# ses compteurs : une classe qui enchaine les mots de passe faux, comme
# ConnexionSansOracleIT, atteindrait le plafond selon l ordre de ses cas. Le plafond est
# prouve par PlafondConnexionIpIT, qui le ramene a cinq dans son propre contexte.
autoservplus.securite.connexion.echecs-max-par-ip=1000000
