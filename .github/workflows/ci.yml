name: Integration continue

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compilation et tests
    runs-on: ubuntu-latest

    steps:
      - name: Recuperation du code
        uses: actions/checkout@v5

      - name: Installation de Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Rendre le wrapper executable
        run: chmod +x ./mvnw

      - name: Compilation
        run: ./mvnw -B compile

      - name: Tests unitaires, integration et couverture
        run: ./mvnw -B verify

  docker-build:
    name: Construction de l'image Docker
    runs-on: ubuntu-latest

    # En parallele de « build » et non a sa suite : les deux partent du meme commit et
    # ne dependent pas l'un de l'autre. Les enchainer doublerait le delai de retour
    # sans rien verifier de plus — un Dockerfile casse doit se voir tout de suite, pas
    # apres les tests d'integration.
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v5

      # Aucune poussee vers un registre : le depot n'en a pas, et le deploiement
      # construit l'image sur le serveur. Ce qui est verifie ici est donc exactement ce
      # qui compte — que le Dockerfile aboutisse encore, a chaque commit. Une
      # dependance ajoutee au pom.xml ou un fichier deplace hors du contexte de build
      # casserait le deploiement sans casser aucun test.
      - name: Construction de l'image
        run: docker build -t autoservplus:ci .
