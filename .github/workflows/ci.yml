name: Integration continue

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compilation et tests
    runs-on: ubuntu-latest

    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Installation de Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Rendre le wrapper executable
        run: chmod +x ./mvnw

      - name: Compilation
        run: ./mvnw -B compile

      - name: Tests unitaires
        run: ./mvnw -B test