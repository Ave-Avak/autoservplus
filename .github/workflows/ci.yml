name: Integration continue

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compilation et tests
    runs-on: ubuntu-latest

    steps:
      - name: Recuperation du code
        uses: actions/checkout@v5

      - name: Installation de Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Rendre le wrapper executable
        run: chmod +x ./mvnw

      - name: Compilation
        run: ./mvnw -B --no-transfer-progress compile

      # Les tests d'intégration ouvrent les écrans dans Chromium (Playwright). Le
      # navigateur est mis en cache sous la version de Playwright du pom.xml : une
      # autre version appelle un autre Chromium. Les bibliothèques système dont il
      # dépend ne se mettent pas en cache, elles sont installées à chaque exécution.
      - name: Version de Playwright
        id: playwright
        run: echo "version=$(./mvnw -q help:evaluate -Dexpression=playwright.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Cache de Chromium
        id: chromium
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Installation de Chromium et de ses bibliothèques
        if: steps.chromium.outputs.cache-hit != 'true'
        run: ./mvnw -B --no-transfer-progress exec:java -e -D exec.classpathScope=test -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"

      - name: Installation des bibliothèques de Chromium
        if: steps.chromium.outputs.cache-hit == 'true'
        run: ./mvnw -B --no-transfer-progress exec:java -e -D exec.classpathScope=test -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install-deps chromium"

      # Enregistré ici, avant les tests, et non en fin de job : un test en échec
      # n'empêche plus de garder le navigateur pour l'exécution suivante.
      - name: Enregistrement du cache de Chromium
        if: always() && steps.chromium.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Sans cette variable, Playwright télécharge à son premier lancement les
      # navigateurs qui lui manquent, Firefox et WebKit compris, en plein test.
      - name: Tests unitaires, integration et couverture
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: ./mvnw -B --no-transfer-progress verify

      # La sortie des tests n'est plus dans la console (redirectTestOutputToFile) :
      # sans ces rapports, un échec en CI ne laisserait rien à lire.
      # target/navigateur porte la capture d'écran et la trace Playwright d'un test
      # de navigateur en échec, et le rapport d'accessibilité.
      - name: Rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-de-tests
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/navigateur/
          retention-days: 7

  docker-build:
    name: Construction de l'image Docker
    runs-on: ubuntu-latest

    # En parallele de « build » et non a sa suite : les deux partent du meme commit et
    # ne dependent pas l'un de l'autre. Les enchainer doublerait le delai de retour
    # sans rien verifier de plus : un Dockerfile casse doit se voir tout de suite, pas
    # apres les tests d'integration.
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v5

      # Aucune poussee vers un registre : le depot n'en a pas, et le deploiement
      # construit l'image sur le serveur. Ce qui est verifie ici est donc exactement ce
      # qui compte : que le Dockerfile aboutisse encore, a chaque commit. Une
      # dependance ajoutee au pom.xml ou un fichier deplace hors du contexte de build
      # casserait le deploiement sans casser aucun test.
      - name: Construction de l'image
        run: docker build -t autoservplus:ci .
